# Form 1040 line 10 (Schedule 1 line 26) workflow for taxpayer/family head.
# Approach: keep user questions + imported statement fields + computed outputs in one YAML.
# NOTE: Sections marked as backend-only are NOT supposed to be rendered in the actual form component.
name: income-adjustments-taxpayer
title: Form 1040 - Income adjustments (taxpayer, line 10 via Schedule 1 line 26)
multiplicity: single
formName: 1040
category: income
instructions:
  - Start here only if you had adjustments to income that belong on Schedule 1 Part II and Form 1040 line 10.
  - Form 1040 line 10 is computed from Schedule 1 line 26.
  - Schedule 1 line 26 is lines 11 through 23 plus line 25.
  - Return-level statement upload confirmations are handled on this taxpayer form.
  - Self-employment adjustments (lines 15 to 17) are out of scope and must be blocked.
sections:
  - name: screening
    title: Screening
    multiplicity: single
    fields:
      - name: hadIncomeAdjustmentsForSchedule1
        type: boolean
        required: true
        label: Did you have income adjustments that belong on Schedule 1 and Form 1040 line 10?
        help: If No, stop here and do not continue this workflow.

  - name: outOfScopeScreening
    title: Out-of-scope screening
    multiplicity: single
    showIf: hadIncomeAdjustmentsForSchedule1 == true
    instructions:
      - Schedule 1 lines 15 through 17 are self-employment-only and out of scope for this product.
    fields:
      - name: hasDeductibleSelfEmploymentTaxLine15OutOfScope
        type: boolean
        required: false
        label: Do you have a deductible self-employment tax adjustment?
        help: Select Yes if Schedule SE is required. This return will be blocked in this product.
      - name: hasSelfEmployedRetirementPlanAdjustmentLine16OutOfScope
        type: boolean
        required: false
        label: Do you have a self-employed retirement plan adjustment?
        help: Select Yes if this self-employment adjustment is required. This return will be blocked.
      - name: hasSelfEmployedHealthInsuranceAdjustmentLine17OutOfScope
        type: boolean
        required: false
        label: Do you have a self-employed health insurance adjustment?
        help: Select Yes if this self-employment adjustment is required. This return will be blocked.

  - name: schedule1Lines11to23
    title: Deductions and adjustments
    multiplicity: single
    showIf: hadIncomeAdjustmentsForSchedule1 == true
    fields:
      - name: educatorExpensesLine11
        type: amount
        required: false
        label: Educator expenses
        placeholder: 0.00
        help: K-12 teachers and other eligible educators may deduct up to $300 for unreimbursed classroom expenses.
      - name: reservistPerformingArtistFeeBasisExpensesLine12
        type: amount
        required: false
        label: Certain business expenses of reservists, performing artists, and fee-basis officials
        placeholder: 0.00
        help: Covers unreimbursed business expenses for Armed Forces reservists, qualified performing artists, and fee-basis government officials.
      - name: hsaDeductionLine13
        type: amount
        required: false
        label: Health savings account (HSA) deduction
        placeholder: 0.00
        help: Enter HSA contributions made outside of payroll deductions. Payroll HSA contributions (Box 12 Code W) are already excluded from wages.
      - name: movingExpensesArmedForcesLine14
        type: amount
        required: false
        label: Moving expenses for members of the Armed Forces
        placeholder: 0.00
        help: Only active-duty Armed Forces members who move due to a military order may deduct moving expenses.
      - name: movingExpensesStorageFeesOnlyLine14
        type: boolean
        required: false
        label: Are these moving expenses for storage fees only?
        help: Select Yes if the moving expense amount consists entirely of storage fees.
      - name: isActiveDutyMilitaryMoveLine14
        type: boolean
        required: false
        label: Are you an active-duty Armed Forces member moving under a military order?
        help: For tax years 2018-2025, moving expenses are deductible ONLY for members of the Armed Forces on active duty who move pursuant to a military order and permanent change of station (IRC §217(k)). If No, the moving-expense amount above will not be deducted.
      - name: penaltyOnEarlyWithdrawalOfSavingsLine18
        type: amount
        required: false
        label: Penalty on early withdrawal of savings
        placeholder: 0.00
        help: Enter the penalty paid for early withdrawal from a savings account or CD, as shown on a 1099-INT or 1099-OID.
      - name: alimonyPaidLine19a
        type: amount
        required: false
        label: Alimony paid (pre-2019 agreements only)
        placeholder: 0.00
        help: Only alimony under a divorce or separation agreement executed before 2019 is deductible.
      - name: alimonyRecipientSsnLine19b
        type: text
        required: false
        label: Alimony recipient's Social Security number
        placeholder: ###-##-####
        help: Enter the recipient's SSN. Required when claiming an alimony deduction.
      - name: alimonyAgreementDateLine19c
        type: date
        required: false
        label: Date of divorce or separation agreement
        help: Enter the date of the original agreement. Only pre-2019 agreements qualify for deductibility.
      - name: iraDeductionLine20
        type: amount
        required: false
        label: IRA deduction
        placeholder: 0.00
        help: Enter contributions to a traditional IRA that qualify as deductible based on income and retirement plan coverage.
      - name: isCoveredByWorkplaceRetirementPlanTaxpayer
        type: boolean
        required: false
        label: Are you covered by a retirement plan at work?
        help: Includes 401(k), 403(b), pension, SEP, SIMPLE, and other qualified plans. Affects whether your IRA contribution is fully deductible. If uncertain, check Box 13 (Retirement plan) on your W-2.
      - name: studentLoanInterestDeductionLine21
        type: amount
        required: false
        label: Student loan interest deduction
        placeholder: 0.00
        help: Enter interest paid on qualified student loans. Maximum deduction is $2,500 and phases out at higher income.
      - name: archerMsaDeductionLine23
        type: amount
        required: false
        label: Archer MSA deduction
        placeholder: 0.00
        help: Enter deductible Archer MSA amount for line 23.

  - name: schedule1OtherAdjustments24aTo24k
    title: Less common adjustments
    multiplicity: single
    showIf: hadIncomeAdjustmentsForSchedule1 == true
    fields:
      - name: otherAdjustmentJuryDutyPayLine24a
        type: amount
        required: false
        label: Jury duty pay given to your employer
        placeholder: 0.00
        help: Enter jury duty pay that you turned over to your employer as required.
      - name: otherAdjustmentDeductibleExpensesRelatedTo8lLine24b
        type: amount
        required: false
        label: Deductible expenses related to income reported on Schedule 1
        placeholder: 0.00
        help: Enter deductible expenses tied to personal-property rental income reported on Schedule 1.
      - name: otherAdjustmentNontaxableOlympicParalympicLine24c
        type: amount
        required: false
        label: Nontaxable Olympic and Paralympic prize amounts
        placeholder: 0.00
        help: Enter nontaxable prize amounts received for Olympic or Paralympic competition.
      - name: otherAdjustmentReforestationAmortizationLine24d
        type: amount
        required: false
        label: Reforestation amortization and expenses
        placeholder: 0.00
        help: Enter deductible reforestation amortization and qualifying expenses.
      - name: otherAdjustmentTradeActRepaymentLine24e
        type: amount
        required: false
        label: Repayment of supplemental unemployment benefits under the Trade Act
        placeholder: 0.00
        help: Enter repayment of supplemental unemployment benefits received under the Trade Act.
      - name: otherAdjustmentContributions501c18dLine24f
        type: amount
        required: false
        label: Contributions to section 501(c)(18)(D) pension plans
        placeholder: 0.00
        help: Enter deductible contributions to a section 501(c)(18)(D) pension plan.
      - name: otherAdjustmentChaplain403bContributionsLine24g
        type: amount
        required: false
        label: Contributions by certain chaplains to section 403(b) plans
        placeholder: 0.00
        help: Enter deductible chaplain contributions to section 403(b) plans that were not excludable from income.
      - name: otherAdjustmentAttorneyFeesUnlawfulDiscriminationLine24h
        type: amount
        required: false
        label: Attorney fees and court costs for unlawful discrimination claims
        placeholder: 0.00
        help: Enter deductible attorney fees and court costs paid in connection with an unlawful discrimination claim.
      - name: line24hGrossIncomeFromDiscriminationAction
        type: amount
        required: false
        label: Income included from the discrimination judgment or settlement
        placeholder: 0.00
        help: >
          Enter the amount of the judgment or settlement that was included in your income. Per IRC
          §62(a)(20) the line 24h deduction cannot exceed this amount; if the fees above are larger,
          they are automatically reduced to this amount. Leave blank if not applicable.
      - name: otherAdjustmentAttorneyFeesIrsAwardLine24i
        type: amount
        required: false
        label: Attorney fees and court costs for IRS whistleblower award claims
        placeholder: 0.00
        help: Enter deductible attorney fees and court costs paid in connection with an IRS whistleblower award.
      - name: line24iWhistleblowerAwardIncludedInIncome
        type: amount
        required: false
        label: Whistleblower award reported as income
        placeholder: 0.00
        help: >
          Enter the IRS whistleblower award amount reported as income. Per IRC §62(a)(21) the line
          24i deduction cannot exceed this amount; larger fees are automatically reduced to it.
          Leave blank if not applicable.
      - name: otherAdjustmentHousingDeductionForm2555Line24j
        type: amount
        required: false
        label: Foreign housing deduction
        placeholder: 0.00
        help: Enter the foreign housing deduction computed on Form 2555 for amounts that exceed the base housing exclusion. Distinct from the foreign earned income exclusion on Schedule 1 line 8d.
      - name: otherAdjustmentExcessDeductionsSection67eLine24k
        type: amount
        required: false
        label: Excess deductions of an estate (Section 67(e) expenses from Schedule K-1)
        placeholder: 0.00
        help: Enter the amount of section 67(e) excess deductions shown on Schedule K-1 (Form 1041).

  - name: otherAdjustmentsItems24z
    title: Other adjustments items (line 24z)
    multiplicity: multiple
    showIf: hadIncomeAdjustmentsForSchedule1 == true
    instructions:
      - Add one row for each additional line 24z adjustment item.
    fields:
      - name: description
        type: text
        required: true
        label: Description
        placeholder: Enter line 24z description
        help: Enter a short description for this other adjustment item.
      - name: amount
        type: amount
        required: true
        label: Amount
        placeholder: 0.00
        help: Enter amount for this line 24z item.

  - name: educatorExpenseDetails
    title: "Educator expenses - eligibility and reductions (Schedule 1 line 11)"
    multiplicity: single
    showIf: "(educatorExpensesLine11 ?? 0) > 0"
    fields:
      - name: isEligibleEducator
        type: boolean
        required: false
        label: "Were you a kindergarten through grade 12 teacher, instructor, counselor, principal or aide who worked at least 900 hours in a school year?"
        showIf: "(educatorExpensesLine11 ?? 0) > 0"
      - name: educatorExpenseReductions
        type: number
        required: false
        label: "Amounts that reduce these expenses (optional)"
        showIf: "(educatorExpensesLine11 ?? 0) > 0 && isEligibleEducator != false"

  - name: form2106Line12Expenses
    title: "Reservist / performing artist / fee-basis official expenses (Form 2106 Part I -> Schedule 1 line 12)"
    multiplicity: single
    showIf: "reservistPerformingArtistFeeBasisExpensesLine12 shown"
    fields:
      - name: line12ExpenseCategory
        type: select
        required: false
        label: "Which of these describes you?"
        options: ["reservist", "performingArtist", "feeBasisOfficial"]
      - name: reservistTravelOver100Miles
        type: boolean
        required: false
        label: "Was the travel to your drills or meetings more than 100 miles from home?"
        showIf: "line12ExpenseCategory == 'reservist'"
      - name: reservistFederalPerDiemTotal
        type: number
        required: false
        label: "Federal per diem for your travel days (lodging plus meals and incidentals) - optional"
        showIf: "line12ExpenseCategory == 'reservist' && reservistTravelOver100Miles == true"
      - name: performingArtistTwoEmployers200
        type: boolean
        required: false
        label: "Did at least two performing-arts employers each pay you $200 or more?"
        showIf: "line12ExpenseCategory == 'performingArtist'"
      - name: performingArtsWagesAmount
        type: number
        required: false
        label: "Wages from performing arts"
        showIf: "line12ExpenseCategory == 'performingArtist'"
      - name: form2106Line1VehicleExpense
        type: number
        required: false
        label: "Vehicle expense (Form 2106 line 1)"
        help: "Figured from the Part II vehicles when a vehicle is entered."
      - name: form2106Line2ParkingTollsTransportation
        type: number
        required: false
        label: "Parking fees, tolls, and local transportation (Form 2106 line 2)"
      - name: form2106Line3TravelExpense
        type: number
        required: false
        label: "Travel expense while away from home (lodging, airfare - not meals) (Form 2106 line 3)"
      - name: form2106Line4OtherBusinessExpenses
        type: number
        required: false
        label: "Other business expenses (not meals) (Form 2106 line 4)"
      - name: form2106Line5MealsExpense
        type: number
        required: false
        label: "Meals (before the 50%/80% limit) (Form 2106 line 5)"
      - name: form2106SubjectToDotHoursOfService
        type: boolean
        required: false
        label: "These meals are subject to the DOT hours-of-service limits (80% instead of 50%)"
      - name: form2106Line7ReimbursementNonMeals
        type: number
        required: false
        label: "Employer reimbursement - non-meals (not in W-2 box 1) (Form 2106 line 7)"
      - name: form2106Line7ReimbursementMeals
        type: number
        required: false
        label: "Employer reimbursement - meals (not in W-2 box 1) (Form 2106 line 7)"
      - name: form2106Line10ReservistPart
        type: number
        required: false
        label: "Split of the Form 2106 total (line 10): reserve travel more than 100 miles from home"
      - name: form2106Line10FeeBasisPart
        type: number
        required: false
        label: "Split of the Form 2106 total (line 10): fee-basis state or local government job"
      - name: form2106Line10PerformingArtistPart
        type: number
        required: false
        label: "Split of the Form 2106 total (line 10): performing-arts work"
        showIf: "line12ExpenseCategory == 'performingArtist'"
      - name: form2106Line10ImpairmentPart
        type: number
        required: false
        label: "Split of the Form 2106 total (line 10): impairment-related work expenses (disability)"

  # Saved as the form2106Vehicles list.
  - name: form2106Vehicles
    title: "Vehicles used for this work (Form 2106 Part II, lines 11-30; one row per vehicle)"
    multiplicity: multiple
    showIf: "reservistPerformingArtistFeeBasisExpensesLine12 shown"
    fields:
      - name: datePlacedInService
        type: date
        required: false
        label: "Date placed in service"
      - name: totalMiles
        type: number
        required: false
        label: "Total miles driven in 2025 (line 12)"
      - name: businessMiles
        type: number
        required: false
        label: "Business miles - not commuting (line 13)"
      - name: commutingMiles
        type: number
        required: false
        label: "Commuting miles (line 16)"
      - name: otherMiles
        type: number
        required: false
        label: "Other personal miles (line 17) - optional"
      - name: hasEvidence
        type: boolean
        required: false
        label: "Do you have evidence to support the deduction (line 20)?"
      - name: evidenceWritten
        type: boolean
        required: false
        label: "Is the evidence written (line 21)?"
      - name: method
        type: select
        required: false
        label: "Method"
        options: ["standardMileage", "actual"]
      - name: gasOilRepairsInsurance
        type: number
        required: false
        label: "Gasoline, oil, repairs, insurance and similar (line 23)"
        showIf: "method == 'actual'"
      - name: vehicleRentals
        type: number
        required: false
        label: "Vehicle rentals (line 24a)"
        showIf: "method == 'actual'"
      - name: inclusionAmount
        type: number
        required: false
        label: "Lease inclusion amount (line 24b)"
        showIf: "method == 'actual'"
      - name: depreciation
        type: number
        required: false
        label: "Depreciation and section 179 for the vehicle (line 28)"
        showIf: "method == 'actual'"
      - name: costBasis
        type: number
        required: false
        label: "Cost or other basis of the vehicle (line 30)"
        showIf: "method == 'actual'"

  # outstanding.md A39 (owner-approved fields): IRA contributions and the 6% excess-contribution tax, Form 5329 Parts III-IV.
  - name: iraContributionsExcessForm5329
    title: "IRA contributions and the 6% tax on excess contributions (Form 5329 Parts III-IV)"
    multiplicity: single
    fields:
      - name: traditionalIraContributionAmount
        type: number
        required: false
        label: "Amount you put into traditional IRAs for 2025"
        help: "Everything put into traditional IRAs for 2025 (including Jan 1 - Apr 15, 2026 deposits for 2025); compared with the $7,000 ($8,000 age 50+) limit."
      - name: rothIraContributionAmount
        type: number
        required: false
        label: "Amount you put into Roth IRAs for 2025"
      - name: iraExcessWithdrawnByDueDate
        type: boolean
        required: false
        label: "Did you take any of it back out before the return was due (April 15, 2026)?"
        showIf: "an IRA contribution was entered"
      - name: traditionalIraExcessWithdrawnAmount
        type: number
        required: false
        label: "Amount taken back out of the traditional IRA (not counting earnings)"
        showIf: "iraExcessWithdrawnByDueDate == true && traditionalIraContributionAmount"
      - name: rothIraExcessWithdrawnAmount
        type: number
        required: false
        label: "Amount taken back out of the Roth IRA (not counting earnings)"
        showIf: "iraExcessWithdrawnByDueDate == true && rothIraContributionAmount"
      - name: iraExcessWithdrawnEarnings
        type: number
        required: false
        label: "Earnings taken out with it"
        showIf: "iraExcessWithdrawnByDueDate == true"
      - name: traditionalIraPriorYearExcess
        type: number
        required: false
        label: "Excess traditional IRA contributions from earlier years still in the account"
        help: "Form 5329 line 9 (excess from earlier years still in the account)."
      - name: traditionalIraPriorExcessReturned
        type: number
        required: false
        label: "Of that earlier excess, amount returned to you in 2025"
        showIf: "(traditionalIraPriorYearExcess ?? 0) > 0"
        help: "An excess from an earlier year taken out in 2025 (Form 5329 line 12)."
      - name: traditionalIraPriorExcessReturnedDeductible
        type: boolean
        required: false
        label: "Did you deduct any of it, or could you have? (it then counts as a distribution instead)"
        showIf: "(traditionalIraPriorExcessReturned ?? 0) > 0"
      - name: traditionalIraYearEndValue
        type: number
        required: false
        label: "Value of your traditional IRAs on December 31, 2025"
        help: "The line 17 6% tax is limited to 6% of the December 31, 2025 value."
      - name: rothIraPriorYearExcess
        type: number
        required: false
        label: "Excess Roth IRA contributions from earlier years still in the account"
        help: "Form 5329 line 18 (excess from earlier years still in the account)."
      - name: rothIraEntireBalanceWithdrawn
        type: boolean
        required: false
        label: "Did you withdraw the entire balance of all your Roth IRAs in 2025?"
        showIf: "(rothIraPriorYearExcess ?? 0) > 0"
        help: "If every Roth IRA was emptied, none of the earlier excess is left (Form 5329 line 20)."
      - name: rothIraYearEndValue
        type: number
        required: false
        label: "Value of your Roth IRAs on December 31, 2025"
        help: "The line 25 6% tax is limited to 6% of the December 31, 2025 value."

  # Backend-only imported fields. Not rendered in the actual form component.
  - name: importedStatementFields
    title: Imported statement fields (backend only)
    multiplicity: single
    showIf: hadIncomeAdjustmentsForSchedule1 == true
    fields:
      - name: imported1098EBox1StudentLoanInterestTotal
        type: amount
        required: false
        readOnly: true
        label: Imported Form 1098-E box 1 student loan interest total
      - name: imported1099IntEarlyWithdrawalPenaltyTotal
        type: amount
        required: false
        readOnly: true
        label: Imported Form 1099-INT early withdrawal penalty total
      - name: imported1099OidEarlyWithdrawalPenaltyTotal
        type: amount
        required: false
        readOnly: true
        label: Imported Form 1099-OID early withdrawal penalty total
      - name: importedK1Section67eExcessDeductionsTotal
        type: amount
        required: false
        readOnly: true
        label: Imported Schedule K-1 section 67(e) excess deductions total

  # Backend-only computed outputs. Not rendered in the actual form component.
  - name: computedOutputs
    title: Computed outputs (backend only)
    multiplicity: single
    showIf: hadIncomeAdjustmentsForSchedule1 == true
    fields:
      - name: computedSchedule1Line25TotalOtherAdjustments
        type: amount
        required: false
        readOnly: true
        label: Computed Schedule 1 line 25 total other adjustments
      - name: computedSchedule1Line26TotalAdjustments
        type: amount
        required: false
        readOnly: true
        label: Computed Schedule 1 line 26 total adjustments to income
      - name: computedForm1040Line10AdjustmentsToIncome
        type: amount
        required: false
        readOnly: true
        label: Computed Form 1040 line 10 adjustments to income
