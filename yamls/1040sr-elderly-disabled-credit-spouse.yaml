# Schedule R (Form 1040) - Credit for the elderly or disabled, spouse.
# Component: form-elderly-disabled-credit.component.ts (formId elderly-disabled-credit-spouse). Screen review 2026-11-09: on a joint
# return the spouse's disability facts and line 13b amount join the one Schedule R; on a separate return the gate is the spouse's own
# claim (MfsFormScoper maps it to claimsElderlyDisabledCredit on the spouse leg), filled with Yes when the spouse is 65 or older.
name: elderly-disabled-credit-spouse
title: Credit for the elderly or disabled (Schedule R)
multiplicity: single
formName: Schedule R
category: credits
sections:
  - name: claim
    title: Your spouse on the joint return / Your spouse's own return
    multiplicity: single
    fields:
      - name: spouseHasElderlyDisabledCreditInputs
        type: boolean
        required: true
        label: "Joint: Did your spouse retire on permanent and total disability, or get a nontaxable pension, annuity or disability benefit in the tax year? Separate: Does your spouse want to claim the credit for the elderly or disabled on their own return?"
      - name: mfsLivedApartAllYear
        type: boolean
        required: false
        showIf: spouseHasElderlyDisabledCreditInputs == true && filingStatus == 'Married filing separately' && filingStatus.mfsLivedWithSpouseAnyTime == null
        label: Did your spouse live apart from you at all times during the tax year?

  - name: spouseDisabilityFacts
    title: Retirement on disability
    multiplicity: single
    showIf: spouseHasElderlyDisabledCreditInputs == true && age65AtEndOfYear != true
    fields:
      - name: spouseRetiredOnPermanentTotalDisability
        type: boolean
        required: false
        label: "Was your spouse retired on permanent and total disability?"
      - name: spouseUnderMandatoryRetirementAgeOnJan1
        type: boolean
        required: false
        showIf: spouseRetiredOnPermanentTotalDisability == true
        label: "Was your spouse under the employer's mandatory retirement age on January 1 of the tax year?"
      - name: spouseReceivedTaxableDisabilityIncome
        type: boolean
        required: false
        showIf: spouseRetiredOnPermanentTotalDisability == true
        label: "Did your spouse get taxable disability income for the tax year?"
      - name: spouseTaxableDisabilityIncomeAmount
        type: amount
        required: false
        showIf: spouseReceivedTaxableDisabilityIncome == true
        label: Taxable disability income for the tax year
        help: "Schedule R line 11."
      - name: spouseExistingPhysicianStatement
        type: boolean
        required: false
        showIf: spouseRetiredOnPermanentTotalDisability == true
        label: "Does your spouse have a physician's statement from an earlier year saying the condition will never improve (signed on line B)?"
        help: "Checks the Schedule R Part II line 2 box (boxes 2, 4, 5, 6, 9 only)."

  - name: spouseNontaxable
    title: Nontaxable pensions and benefits
    multiplicity: single
    showIf: spouseHasElderlyDisabledCreditInputs == true
    instructions:
      - "Nontaxable Social Security (line 13a) is figured from Social security benefits (Form 1040 line 6a minus 6b)."
    fields:
      - name: spouseNontaxablePensionBenefits
        type: amount
        required: false
        label: "Nontaxable veterans' and other pensions, annuities or disability benefits"
        help: "Schedule R line 13b (the spouse's amount on a joint return only)."
