# Schedule R (Form 1040) - Credit for the elderly or disabled, Family Head (taxpayer).
# Component: form-elderly-disabled-credit.component.ts (formId elderly-disabled-credit-taxpayer; the same component saves
# elderly-disabled-credit-spouse). Screen review 2026-11-09 (Instructions for Schedule R (2025)): one Schedule R per return on a
# joint return; the age comes from the date of birth on Identification (65 or older fills the claim with Yes and skips the
# disability questions); confirmQualificationSupportReady removed from the screen (read by nothing, owner 2026-11-09; column kept).
name: elderly-disabled-credit-taxpayer
title: Credit for the elderly or disabled (Schedule R)
multiplicity: single
formName: Schedule R
category: credits
instructions:
  - "A credit for a person 65 or older at the end of the year, or younger and retired on permanent and total disability."
sections:
  - name: claim
    title: Claiming the credit
    multiplicity: single
    fields:
      - name: claimsElderlyDisabledCredit
        type: boolean
        required: true
        label: "Do you want to claim the credit for the elderly or disabled? (joint: on your joint return)"
        help: "Filled with Yes when the Family Head (or the spouse on a joint return) is 65 or older by the date of birth."
      - name: mfsLivedApartAllYear
        type: boolean
        required: false
        showIf: claimsElderlyDisabledCredit == true && filingStatus == 'Married filing separately' && filingStatus.mfsLivedWithSpouseAnyTime == null
        label: Did you live apart from your spouse at all times during the tax year?
        help: "Asked only when Filing status hasn't answered it; Filing status's answer wins."

  - name: taxpayerDisabilityFacts
    title: Retirement on disability
    multiplicity: single
    showIf: claimsElderlyDisabledCredit == true && age65AtEndOfYear != true
    fields:
      - name: taxpayerRetiredOnPermanentTotalDisability
        type: boolean
        required: false
        label: "Were you retired on permanent and total disability?"
      - name: taxpayerUnderMandatoryRetirementAgeOnJan1
        type: boolean
        required: false
        showIf: taxpayerRetiredOnPermanentTotalDisability == true
        label: "Were you under the employer's mandatory retirement age on January 1 of the tax year?"
      - name: taxpayerReceivedTaxableDisabilityIncome
        type: boolean
        required: false
        showIf: taxpayerRetiredOnPermanentTotalDisability == true
        label: "Did you get taxable disability income for the tax year?"
      - name: taxpayerTaxableDisabilityIncomeAmount
        type: amount
        required: false
        showIf: taxpayerReceivedTaxableDisabilityIncome == true
        label: Taxable disability income for the tax year
        help: "Schedule R line 11."
      - name: taxpayerExistingPhysicianStatement
        type: boolean
        required: false
        showIf: taxpayerRetiredOnPermanentTotalDisability == true
        label: "Do you have a physician's statement from an earlier year saying the condition will never improve (signed on line B)?"
        help: "Checks the Schedule R Part II line 2 box (boxes 2, 4, 5, 6, 9 only)."

  - name: taxpayerNontaxable
    title: Nontaxable pensions and benefits
    multiplicity: single
    showIf: claimsElderlyDisabledCredit == true
    instructions:
      - "Nontaxable Social Security (line 13a) is figured from Social security benefits (Form 1040 line 6a minus 6b)."
    fields:
      - name: taxpayerNontaxablePensionBenefits
        type: amount
        required: false
        label: "Nontaxable veterans' and other pensions, annuities or disability benefits"
        help: "Schedule R line 13b (the spouse's amount on a joint return only)."
