# Form 1040 line 12a-12e taxpayer/family head workflow.
# Approach: keep return-level deduction election, Schedule A inputs, and taxpayer indicators on the taxpayer form.
# NOTE: This file is the shared yamls-folder copy of the active line 12 taxpayer interview.
name: standard-deductions-taxpayer
title: Form 1040 - Standard deductions (taxpayer/family head, lines 12a through 12e)
multiplicity: single
formName: 1040
category: deductions
instructions:
  - Use this taxpayer/family head form for the return-level line 12 deduction choice, taxpayer indicators, and Schedule A inputs.
  - Form 1040 line 12e is selected here and may use the standard deduction, itemized deductions, or the larger amount when auto-select is chosen.
  - Spouse-only line 12 indicators are captured in the spouse form.
sections:
  - name: deductionElection
    title: Line 12e selection
    multiplicity: single
    fields:
      - name: deductionElection
        type: select
        required: false
        label: How should line 12e be selected?
        options:
          - Auto choose the larger deduction
          - Take the standard deduction
          - Itemize deductions

  - name: taxpayerIndicators
    title: Taxpayer line 12 indicators
    multiplicity: single
    fields:
      - name: someoneCanClaimYou
        type: boolean
        required: false
        label: Someone can claim you as a dependent
      - name: youWereDualStatusAlien
        type: boolean
        required: false
        label: You were a dual-status alien
      - name: youBornBeforeThreshold
        type: boolean
        required: false
        label: You were born before the threshold date for the tax year
      - name: youAreBlind
        type: boolean
        required: false
        label: You are blind
      - name: dependentStandardDeductionEarnedIncome
        type: number
        required: false
        label: Dependent standard deduction earned income

  - name: scheduleAInputs
    title: Schedule A inputs
    multiplicity: single
    fields:
      - name: medicalDentalExpensesPaid
        type: number
        required: false
        label: Medical and dental expenses paid
      - name: stateLocalTaxChoice
        type: select
        required: false
        label: State and local tax choice
        options:
          - Income
          - Sales
      - name: stateLocalIncomeTaxesPaid
        type: number
        required: false
        label: State and local income taxes paid
      - name: stateLocalSalesTaxesPaid
        type: number
        required: false
        label: State and local sales taxes paid
      - name: realEstateTaxesPaid
        type: number
        required: false
        label: Real estate taxes paid
      - name: personalPropertyTaxesPaid
        type: number
        required: false
        label: Personal property taxes paid
      - name: homeMortgageInterestPaid
        type: number
        required: false
        label: Qualified home mortgage interest paid
      - name: homeMortgagePointsPaid
        type: number
        required: false
        label: Qualified home mortgage points paid
      - name: investmentInterestPaid
        type: number
        required: false
        label: Investment interest paid
      - name: netInvestmentIncome
        type: number
        required: false
        label: Net investment income for the investment-interest limit
      - name: priorYearInvestmentInterestCarryover
        type: number
        required: false
        label: Prior-year disallowed investment interest carryover (Form 4952 line 7)
      - name: electInvestmentIncomeIncludesQualifiedDividendsAndCapitalGain
        type: boolean
        required: false
        label: Elect to include qualified dividends or net long-term capital gain in investment income (Form 4952 line 4g)
      - name: electedQualifiedDividendsAndCapitalGainAmount
        type: number
        required: false
        label: Amount of qualified dividends or net long-term capital gain elected (Form 4952 line 4g amount)
      - name: charitableCashContributions
        type: number
        required: false
        label: Charitable cash contributions
      - name: charitableNonCashContributions
        type: number
        required: false
        label: Charitable non-cash contributions
      - name: charitableCashBenefitReceivedAmount
        type: number
        required: false
        label: Value of goods or services received for a cash gift (quid pro quo)
        help: If you received something in return for a cash gift (a dinner, tickets, merchandise), enter the fair market value of what you received. Only the amount of your gift that EXCEEDS this value is deductible (IRC §170(f)(8)).
      - name: charitableVehicleDonationAmount
        type: number
        required: false
        label: Donated vehicle / boat / airplane (claimed value)
        help: Enter the claimed value of a donated vehicle, boat, or airplane. If the charity sold it, your deduction is automatically limited to the gross sales proceeds shown in box 4c of the Form 1098-C you upload (IRC §170(f)(12)).
      - name: charitableUnrelatedUseTangibleFmv
        type: number
        required: false
        label: Tangible personal property put to an unrelated use (claimed value)
        help: Appreciated tangible personal property (art, collectibles, equipment) donated to a charity that uses it for a purpose UNRELATED to its exempt function is deductible only at cost basis, not FMV (IRC §170(e)(1)(B)(i)). Enter the claimed value; the app reduces it to the basis below.
      - name: charitableUnrelatedUseTangibleBasis
        type: number
        required: false
        label: Cost basis of the unrelated-use property
        help: Your cost basis in the tangible personal property put to an unrelated use. The deduction is limited to this amount.
      - name: charitableCapGainPrivateFoundation
        type: number
        required: false
        label: Appreciated property donated to a private foundation (fair market value)
        help: Long-term appreciated property to a private (non-operating) foundation is deductible only at basis unless it is qualified appreciated stock (IRC §170(e)(1)(B)(ii)).
      - name: charitablePfCapGainBasis
        type: number
        required: false
        label: Cost basis (private-foundation appreciated property)
        help: Cost basis in the appreciated property donated to the private foundation. Used when the property is NOT qualified appreciated stock — the deduction is reduced to basis (30%-of-AGI limit).
      - name: charitablePfCapGainIsQualifiedAppreciatedStock
        type: boolean
        required: false
        label: Is the private-foundation gift qualified appreciated stock (publicly traded)?
        help: If Yes, the gift stays deductible at fair market value (20%-of-AGI limit); if No, it is reduced to cost basis (30%-of-AGI limit) per IRC §170(e)(1)(B)(ii).
      - name: priorYearCharitableContributionCarryover
        type: number
        required: false
        label: Prior-year charitable contribution carryover (Schedule A line 13)
      - name: personalCasualtyAndTheftLoss
        type: number
        required: false
        label: Personal casualty and theft losses from a federally declared disaster (separate from the net qualified disaster loss standard-deduction increase)
        help: Enter the FINAL deductible amount from Form 4684 — already reduced by the $100-per-event floor and the 10%-of-AGI floor (IRC §165(h)). To have these reductions applied automatically, use the per-event casualty inputs (adjusted basis, FMV decline, insurance reimbursement, disaster indicator) instead.
      - name: foreignTaxesPaid
        type: number
        required: false
        label: Foreign taxes paid (not subject to the SALT cap; use only when not claiming the foreign tax credit)
      - name: gamblingLossesDeduction
        type: number
        required: false
        label: Gambling losses
        help: Enter your total gambling losses for the year. These are deductible only up to the gambling winnings you reported as income (Schedule 1 line 8b), per IRC §165(d). Any excess is automatically dropped.
      - name: otherAllowedItemizedDeductions
        type: number
        required: false
        label: Other allowed itemized deductions (such as attorney fees from unlawful discrimination claims, amortizable bond premium, or other Schedule A line 16 write-ins)
        help: For impairment-related work expenses, estate tax on income in respect of a decedent, a claim-of-right repayment, or an investment-property casualty/theft loss, use the dedicated fields below instead.
      # Schedule A line 16 structured "Other Itemized Deductions" — items that survive the 2018-2025
      # misc-2%/personal-casualty suspensions. Each is deductible in full (no floors) (V226).
      - name: hasImpairmentRelatedWorkExpenses
        type: boolean
        required: false
        label: You have a physical or mental impairment and paid work expenses that let you work (impairment-related work expenses)
      - name: impairmentRelatedWorkExpenses
        type: number
        required: false
        label: Impairment-related work expenses (Schedule A line 16)
        help: Attendant care at your workplace and similar expenses needed for a person with a disability to work are deductible in full with NO 2%-of-AGI floor (IRC §67(d)). Enter only the impairment-related portion.
        showIf: hasImpairmentRelatedWorkExpenses == true
      - name: receivedIrdWithEstateTaxPaid
        type: boolean
        required: false
        label: You reported income in respect of a decedent (IRD) on which federal estate tax was paid
      - name: estateTaxOnIrdDeduction
        type: number
        required: false
        label: Estate tax attributable to income in respect of a decedent (Schedule A line 16)
        help: The federal estate tax attributable to the IRD you reported (IRC §691(c)) — the estate tax computed WITH the IRD minus the estate tax computed WITHOUT it. Relieves the estate + income double tax.
        showIf: receivedIrdWithEstateTaxPaid == true
      - name: claimOfRightRepaymentDeduction
        type: number
        required: false
        label: Claim-of-right repayment over $3,000 — deduction method (Schedule A line 16)
        help: If you repaid more than $3,000 that you included in income in an earlier year under a claim of right, you may deduct it here (IRC §1341). Alternatively you can take the §1341 credit (Schedule 3 line 13b) — use whichever gives the lower tax. Repayments of $3,000 or less are not deductible for 2025.
      - name: netQualifiedDisasterLoss
        type: number
        required: false
        label: Net qualified disaster loss from a federally declared disaster
      - name: electDisasterLossStandardDeductionIncrease
        type: boolean
        required: false
        label: Elect to increase the standard deduction using the net qualified disaster loss
      - name: hasSection962Election
        type: boolean
        required: false
        label: You made a section 962 election (taxed as a domestic corporation on section 951A inclusions)
      - name: section250DeductionAmount
        type: number
        required: false
        label: Section 250 deduction amount (DO NOT report on line 12e; routes to line 16 with an explanatory statement)
