# Line 13a - Qualified business income deduction (the Family Head). Component: form-qbi-deduction.component.ts. Screen review 2026-11-10: removed
# with their columns (V454, owner 2026-11-10) - the upload confirmation (it blocked the return), the Schedule C / F question (not read),
# the cooperative patron question (Form 1099-PATR box 7 decides) and two notes fields; the screening answer is worked out.
name: qbi-deduction-taxpayer
title: Qualified business income deduction (line 13a)
multiplicity: single
formName: Form 8995 / Form 8995-A
category: deductions
sections:
  - name: sources
    title: Already counted
    multiplicity: single
    note: "read-only list with links: Schedule C businesses, Schedule F, a safe-harbor rental, Schedules K-1 and Forms 1099-DIV with box 5"
  - name: aggregationGroups
    title: Businesses (Schedule K-1 Statement A; aggregation)
    multiplicity: multiple
    showIf: "a Schedule K-1 or a Schedule C business is entered"
    note: "one card per business; saved as aggregationGroups rows keyed by the K-1 EIN / Schedule C name"
    fields:
      - { name: statementAQbi, type: amount, showIf: "a K-1", label: "Qualified business income" }
      - { name: statementAW2Wages, type: amount, showIf: "a K-1", label: "W-2 wages" }
      - { name: statementAUbia, type: amount, showIf: "a K-1", label: "UBIA of qualified property" }
      - { name: statementASstb, type: boolean, showIf: "a K-1", label: "Specified service trade or business?" }
      - { name: groupLabel, type: string, label: "Aggregation group (optional)" }
  - name: carryforward
    title: Losses carried forward from 2024
    multiplicity: single
    fields:
      - { name: hasPriorYearQbiLossCarryforward, type: boolean, required: false, label: "Is there a qualified business net loss carried forward from 2024?" }
      - { name: priorYearQbiLossCarryforwardAmount, type: amount, required: false, showIf: hasPriorYearQbiLossCarryforward == true, label: "Loss carried forward", note: "blank: filled from last year's return done here" }
      - { name: hasPriorYearReitPtpLossCarryforward, type: boolean, required: false, label: "Is there a REIT dividend / PTP net loss carried forward from 2024?" }
      - { name: priorYearReitPtpLossCarryforwardAmount, type: amount, required: false, showIf: hasPriorYearReitPtpLossCarryforward == true, label: "Loss carried forward" }
  - name: patron
    title: Cooperative patron (Form 8995-A Schedule D)
    multiplicity: single
    showIf: "a Form 1099-PATR shows box 7 for the Family Head"
    fields:
      - { name: cooperativeQbiAllocableToQualifiedPayments, type: amount, required: false, label: "Business income allocable to the qualified payments (line 2)" }
      - { name: cooperativeW2WagesAllocableToQualifiedPayments, type: amount, required: false, label: "W-2 wages allocable to them (line 4)" }
  - name: manual
    title: Amounts not on any statement (rare)
    multiplicity: single
    fields:
      - { name: manualQualifiedBusinessIncomeAdjustment, type: amount, required: false, label: "Qualified business income" }
      - { name: manualQualifiedReitDividendAdjustment, type: amount, required: false, label: "Qualified REIT dividends" }
      - { name: manualQualifiedPtpIncomeOrLossAdjustment, type: amount, required: false, label: "Qualified PTP income or loss" }
computedOutputs:
  - { name: hadQualifiedBusinessIncomeInputs, readOnly: true, computed: true, note: "saved Yes when the Family Head has a source or an entry (the screening question was removed)" }
