# Screen review 2026-11-10 (owner, V461): the opening question is removed - madeEstimatedTaxPayments is saved as worked out (Yes
# when any own payment or applied refund is entered); amendedReturnOverpaymentDate added (Form 2210: an overpayment from a 2024
# payment after April 15, 2025 counts on that payment's date). Component: form-estimated-tax-payments.component.ts; help:
# data/estimated-tax-payments-help.ts.
name: estimated-tax-payments-taxpayer
title: Estimated Tax Payments (Taxpayer)
multiplicity: single
category: applications
person: taxpayer

sections:
  - name: screening
    title: Estimated Tax Payments
    fields:
      - name: madeEstimatedTaxPayments
        type: boolean
        required: false
        readOnly: true
        computed: true
        label: "Worked out - Yes when any payment or applied refund is entered (question removed 2026-11-10)"

  - name: installments
    title: 2025 Quarterly Payments
    fields:
      - name: installment1Amount
        type: decimal
        label: Payment for January – March 2025
        help: Due April 15, 2025. Enter the amount you actually paid to the IRS for this period. Leave blank if no payment was made.
        placeholder: "0.00"
        required: false
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: installment1PaymentDate
        type: date
        required: false
        label: "Date paid (leave blank if paid by the due date)"
        showIf: "installment1Amount > 0"
      - name: installment2Amount
        type: decimal
        label: Payment for April – May 2025
        help: Due June 16, 2025 (June 15 was a Sunday). Leave blank if no payment was made for this period.
        placeholder: "0.00"
        required: false
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: installment2PaymentDate
        type: date
        required: false
        label: "Date paid (leave blank if paid by the due date)"
        showIf: "installment2Amount > 0"
      - name: installment3Amount
        type: decimal
        label: Payment for June – August 2025
        help: Due September 15, 2025. Leave blank if no payment was made for this period.
        placeholder: "0.00"
        required: false
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: installment3PaymentDate
        type: date
        required: false
        label: "Date paid (leave blank if paid by the due date)"
        showIf: "installment3Amount > 0"
      - name: installment4Amount
        type: decimal
        label: Payment for September – December 2025
        help: Due January 15, 2026. Not required if you file your return and pay your full balance by February 2, 2026.
        placeholder: "0.00"
        required: false
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: installment4PaymentDate
        type: date
        required: false
        label: "Date paid (leave blank if paid by the due date)"
        showIf: "installment4Amount > 0"

  - name: priorYearCredits
    title: 2024 Refund Applied to 2025
    fields:
      - name: priorYearOverpaymentCredited
        type: decimal
        label: 2024 refund applied to 2025 taxes
        help: If your 2024 return showed a refund and you elected to apply it toward 2025 taxes rather than receive a check, enter that amount here.
        placeholder: "0.00"
        required: false
      - name: amendedReturnOverpaymentCredited
        type: decimal
        label: Additional refund from a corrected 2024 return applied to 2025
        help: If you filed a corrected 2024 return and the extra refund from that correction was applied toward 2025 taxes instead of being paid out, enter it here.
        placeholder: "0.00"
        required: false
      - name: amendedReturnOverpaymentDate
        type: date
        required: false
        showIf: amendedReturnOverpaymentCredited > 0
        label: Date of the 2024 tax payment it came from, if after April 15, 2025

  - name: jointPayments
    title: Payments Made Jointly with Your Spouse (Optional)
    showIf: married filing separately (or head of household while married), Family Head copy
    help: >
      B120 (V368) - Pub. 505 / Pub. 555. Spouses who paid estimated tax jointly but file separately divide the payments as they
      agree; otherwise each return claims total x its tax / the tax on both returns. Entered once here; the spouse's return gets
      the rest of the share. On a joint return the whole amount counts.
    fields:
      - name: madeJointEstimatedPayments
        type: boolean
        label: Did you make any 2025 estimated tax payments jointly with your spouse?
        required: false
      - name: jointInstallment1Amount
        type: decimal
        label: Joint payment for January - March 2025
        showIf: madeJointEstimatedPayments == true
        required: false
      - name: jointInstallment2Amount
        type: decimal
        label: Joint payment for April - May 2025
        showIf: madeJointEstimatedPayments == true
        required: false
      - name: jointInstallment3Amount
        type: decimal
        label: Joint payment for June - August 2025
        showIf: madeJointEstimatedPayments == true
        required: false
      - name: jointInstallment4Amount
        type: decimal
        label: Joint payment for September - December 2025
        showIf: madeJointEstimatedPayments == true
        required: false
      - name: jointPriorYearOverpaymentCredited
        type: decimal
        label: 2024 refund (from a joint 2024 return) applied to 2025
        showIf: madeJointEstimatedPayments == true
        required: false
      - name: jointPaymentsYourSharePct
        type: percent
        label: Your share of the joint payments (%)
        help: Blank = in proportion to the tax on the two separate returns.
        showIf: madeJointEstimatedPayments == true
        required: false

  - name: divorceAnnotation
    title: Payments Made Jointly with a Former Spouse (Optional)
    fields:
      - name: divorceFormerSpouseSSN
        type: string
        label: Former spouse's Social Security number
        help: If you and a former spouse made estimated tax payments together before your divorce in 2025, enter their Social Security number so the IRS can match those payments to your return. Leave blank if this does not apply.
        placeholder: "e.g. 222-22-2222"
        required: false

  - name: withholdingTiming
    title: Withholding Timing (Optional)
    help: OPEN_QUESTIONS B6 (V372) - Form 2210 box D. Withholding counted on the dates it was actually withheld instead of
      one-fourth on each due date (Instructions for Form 2210, Part III line 11); the choice can be made separately for wage
      withholding and all other withholding (Pub. 505). The engine figures the penalty both ways and uses these amounts only
      when lower. A joint return adds both spouses' amounts.
    fields:
      - name: withholdingActualDates
        type: boolean
        label: Was most of your 2025 tax withholding taken out early in the year?
        required: false
      - name: withholdingActualDatesKind
        type: enum
        options: [wages, other, both]
        label: Which withholding?
        help: Blank = both.
        showIf: withholdingActualDates == true
        required: false
      - name: withheldPeriod1Amount
        type: decimal
        label: Withheld January 1 - April 15, 2025
        showIf: withholdingActualDates == true
        required: false
      - name: withheldPeriod2Amount
        type: decimal
        label: Withheld April 16 - June 15, 2025
        showIf: withholdingActualDates == true
        required: false
      - name: withheldPeriod3Amount
        type: decimal
        label: Withheld June 16 - September 15, 2025
        showIf: withholdingActualDates == true
        required: false
      - name: withheldPeriod4Amount
        type: decimal
        label: Withheld September 16 - December 31, 2025
        showIf: withholdingActualDates == true
        required: false
