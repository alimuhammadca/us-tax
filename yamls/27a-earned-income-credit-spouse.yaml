# Screen review 2026-11-10 (owner, V459): the same screen as the Family Head's (form-earned-income-credit.component.ts) with
# spouse-prefixed keys. On a joint return the credit is figured once, on the Family Head's copy, and this copy only links there (the
# old spouse "other earned income" box and its gate are removed - all of Form 1040 line 1h is counted). On a separate return it is
# the spouse's own credit (MfsFormScoper un-prefixes the keys on her return).
formId: earned-income-credit-spouse
title: Earned income credit (spouse)
description: >
  Form 1040 line 27a for the spouse's own return when the spouses file separately. Keys are the Family Head copy's with the
  "spouse" prefix: spouseCouldBeQualifyingChildOfAnother, spouseEicQualifyingChildren (same row fields), spouseMainHomeInUsMoreThanHalfYear,
  spouseEicPreviouslyDenied, spouseEicPriorDisallowanceReason, spouseEicPriorDeterminationYear, spouseEicAllowedSinceForm8862,
  spouseQualifiesForMfsSeparatedSpouseEicException (worked out from Filing status).

sections:

  - id: screening
    title: Who can take the credit
    showIf: filingStatus == "Married filing separately"
    fields:
      - id: spouseCouldBeQualifyingChildOfAnother
        type: boolean
        label: "Could your spouse be a qualifying child of another person for 2025? (V459)"

  - id: qualifyingChildren
    title: Qualifying children (the dependents your spouse claims, plus children not on Dependents)
    multiplicity: multiple
    showIf: filingStatus == "Married filing separately"
    fields:
      - id: spouseEicQualifyingChildren
        type: list
        label: "Rows with the Family Head copy's child fields"

  - id: priorDisallowance
    title: Credit reduced or denied before
    showIf: filingStatus == "Married filing separately"
    fields:
      - id: spouseEicPreviouslyDenied
        type: boolean
        label: Did the IRS reduce or deny your spouse's earned income credit for a year after 1996?
      - id: spouseEicPriorDisallowanceReason
        type: select
        showIf: "spouseEicPreviouslyDenied === true"
        label: "Why was it reduced or denied?"
      - id: spouseEicPriorDeterminationYear
        type: number
        label: "Year of the IRS final decision"
      - id: spouseEicAllowedSinceForm8862
        type: boolean
        label: "Since then, was Form 8862 filed and the credit allowed?"
