# Screen review 2026-11-10 (owner, V459): no opening "claim the credit?" question - the credit is figured whenever the rules allow
# it; the Form 2555, nonresident and two dependent questions are worked out (Foreign income, Standard or itemized deductions "Someone
# can claim you" / dual-status alien, Filing status); the typed "other earned income" box is removed (all of Form 1040 line 1h is
# counted); qualifying children come from Dependents, with typed rows only for a child not on Dependents ("also a dependent" removed);
# "Could you be a qualifying child of another person?" added off a joint return. Component: form-earned-income-credit.component.ts;
# help: data/earned-income-credit-help.ts; calculation: EicInputs + computeLine27aEIC.
formId: earned-income-credit-taxpayer
title: Earned income credit
description: >
  Form 1040 line 27a - 2025 earned income credit. The Family Head's copy; on a joint return it is the one credit for both spouses.
  On a separate return each spouse's copy is that spouse's own credit.

sections:

  - id: screening
    title: Who can take the credit
    fields:
      - id: couldBeQualifyingChildOfAnother
        name: couldBeQualifyingChildOfAnother
        type: boolean
        required: false
        showIf: filingStatus != "Married filing jointly"
        label: "Could you be a qualifying child of another person for 2025? (V459)"
        helpText: >
          2025 Form 1040 instructions, line 27a Step 3 question 6 / Step 4 question 5. Answer No if the other person isn't required
          to file and isn't filing, or files only to claim a refund of tax withheld or paid.

  - id: qualifyingChildren
    title: Qualifying children
    multiplicity: multiple
    description: >
      The dependents who meet the qualifying child tests are counted from Dependents. Rows here are only for a child who isn't on
      the Dependents list; a row with a dependent's SSN fills what the dependent's record leaves blank.
    fields:
      - id: childFirstName
        label: First name
        type: string
      - id: childLastName
        label: Last name
        type: string
      - id: childSSN
        label: Social security number (digits only)
        type: string
      - id: childYearOfBirth
        label: Year of birth
        type: integer
      - id: relationship
        label: Relationship to you
        type: select
        options: [Son, Daughter, Stepchild, Foster child, Brother, Sister, Half brother, Half sister, Stepbrother, Stepsister,
          Grandchild, Nephew, Niece]
      - id: monthsLivedWithTaxpayer
        label: Months lived with you in the United States
        type: integer
      - id: isPermanentlyDisabled
        label: Was the child permanently and totally disabled at any time in 2025?
        type: boolean
      - id: isFullTimeStudent
        label: Was the child a full-time student during some part of 5 months of 2025?
        type: boolean
        showIf: "age 19-23 and not disabled"
      - id: childFiledJointReturn
        label: Did the child file a joint return for 2025 (other than only to claim a refund)?
        type: boolean

  - id: childless
    title: Without a qualifying child
    showIf: "no counted qualifying child and filing status not MFS or HOH"
    fields:
      - id: mainHomeInUsMoreThanHalfYear
        label: Was your main home in the United States for more than half of 2025?
        type: boolean
        helpText: >
          Step 4 question 3. The age test (25-64) comes from the date of birth and the dependent test from Standard or itemized
          deductions ("Someone can claim you"; not on a joint return). A bona fide Puerto Rico resident (child tax credit screen) is
          answered No by the calculation.

  - id: priorDisallowance
    title: Credit reduced or denied before
    fields:
      - id: eicPreviouslyDenied
        label: Did the IRS reduce or deny your earned income credit for a year after 1996?
        type: boolean
      - id: eicPriorDisallowanceReason
        type: select
        showIf: "eicPreviouslyDenied === true"
        label: "Why was it reduced or denied?"
        options:
          - value: "MATH_CLERICAL"
            label: "A math or clerical error"
          - value: "CHILD_NOT_QUALIFYING"
            label: "A child was found not to be my qualifying child"
          - value: "RECKLESS_DISREGARD"
            label: "Reckless or intentional disregard of the rules"
          - value: "FRAUD"
            label: "Fraud"
          - value: "OTHER"
            label: "Another reason"
      - id: eicPriorDeterminationYear
        type: number
        showIf: "eicPriorDisallowanceReason in (RECKLESS_DISREGARD, FRAUD)"
        label: "Year of the IRS final decision"
      - id: eicAllowedSinceForm8862
        type: boolean
        showIf: "eicPreviouslyDenied === true"
        label: "Since then, was Form 8862 filed and the credit allowed?"

  - id: importedStatementFields
    readOnly: true
    fields:
      - id: qualifiesForMfsSeparatedSpouseEicException
        label: Special rule for separated spouses (worked out from Filing status; not shown)
        type: boolean
