# Screen review 2026-11-10 (owner): the opening question and the six Yes/No gates are removed - each has* gate is saved as worked
# out (Yes when its amount is entered); the typed section 1341 credit is removed (line 13b is the credit the app figures from
# Standard or itemized deductions and Social Security benefits; old saved answers are not read); line 13d is the net 965 tax paid in
# installments (it was asked as a section 965(i) triggering event, which is a tax entered on Other tax items); line 13z offers the
# IRS write-ins; on a joint return the spouse copy (31-other-payments-spouse, same keys) is added to this one. No column change.
# Component: form-other-payments.component.ts; help: data/other-payments-help.ts.
name: 31-other-payments
title: Other payments / credits
multiplicity: single
formName: schedule3
category: applications
version: 3
instructions:
  - Payments and refundable credits no other screen asks about. Leave a line blank if it doesn't apply.
  - Not here - figured elsewhere - the premium tax credit (Form 8962), Form 4868 extension payments (Extension of time), excess
    social security tax, Form 2439, and the section 1341 credit (Standard or itemized deductions).
sections:
  - name: otherExtensionPayment
    title: Extension payment with Form 2350 (line 10)
    fields:
      - name: amountPaidWithOtherExtension
        type: decimal
        label: Amount paid with Form 2350
        required: false
      - name: hasOtherExtensionPayment
        type: boolean
        readOnly: true
        computed: true
        label: "Worked out - Yes when an amount is entered (question removed 2026-11-10)"

  - name: fuelTaxCredit
    title: Credit for federal tax on fuels (line 12)
    fields:
      - name: creditForFederalTaxOnFuels
        type: decimal
        label: Form 4136 line 17 total
        required: false
      - name: hasFuelTaxCredit
        type: boolean
        readOnly: true
        computed: true
        label: "Worked out - Yes when an amount is entered"

  - name: section1341
    title: Section 1341 credit for a repayment (line 13b)
    readOnly: true
    computed: true
    note: The figured credit from the last computed return, with links to Standard or itemized deductions and Social Security
      benefits. hasSection1341Credit / section1341RepaymentAmount / section1341Credit are saved blank and not read.

  - name: form3800ElectivePayment
    title: Elective payment from a business credit (line 13c)
    fields:
      - name: netElectivePaymentElectionAmount
        type: decimal
        label: Form 3800 Part III line 6 column (j)
        required: false
      - name: hasForm3800ElectivePayment
        type: boolean
        readOnly: true
        computed: true
        label: "Worked out - Yes when an amount is entered"

  - name: deferred965Tax
    title: Net 965 tax paid in installments (line 13d)
    fields:
      - name: deferredNet965TaxLiability
        type: decimal
        label: Net 965 tax liability still to be paid in later years
        required: false
      - name: hasDeferred965Tax
        type: boolean
        readOnly: true
        computed: true
        label: "Worked out - Yes when an amount is entered"

  - name: otherRefundableCredits
    title: Other refundable credits (line 13z)
    multiplicity: multiple
    listKey: otherRefundableCreditItems
    fields:
      - name: description
        type: select
        options: ["960(c)", "Form 8689", "1062NL"]
        label: Write-in (an older typed description is kept)
      - name: amount
        type: decimal
        label: Amount
      - name: hasOtherRefundableCredits
        type: boolean
        readOnly: true
        computed: true
        label: "Worked out - Yes when a write-in has an amount"
