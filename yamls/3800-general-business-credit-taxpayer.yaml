# Form 3800 - General business credit: unused non-passive credits carried forward (taxpayer / family head).
# Component: form-general-business-credit.component.ts (formId general-business-credit-taxpayer; the same component saves
# general-business-credit-spouse for the spouse). Screen review 2026-11-09: the carryforward is Form 3800 Part I line 4; the limit is
# Form 3800 Part II lines 7-17 (the other nonrefundable credits come off first). If last year's return was done here, its unused
# credit is brought in (a typed amount wins).
name: general-business-credit-taxpayer
title: General business credit (Form 3800)
multiplicity: single
formName: Form 3800
category: credits
instructions:
  - "Business credits more than the tax limit carry forward for up to 20 years; enter the unused ones carried into this year."

sections:
  - name: carryforward
    title: Unused credits from the prior year and earlier
    multiplicity: single
    fields:
      - name: hasGeneralBusinessCreditCarryforward
        type: boolean
        required: true
        label: "Do you have general business credits from the prior year or earlier that haven't been used?"
      - name: priorYearGeneralBusinessCreditCarryforward
        type: amount
        required: false
        label: Credit carried forward to this year
        help: "Non-passive carryforwards (Form 3800 Part IV column (f) -> Part I line 4); passive credits limited by Form 8582-CR are left out."
        showIf: hasGeneralBusinessCreditCarryforward == true
