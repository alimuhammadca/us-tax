# Form 4952 - Investment interest (Family Head: investment-interest-expense-deduction; spouse: -spouse, merged on a joint return and
# each spouse's own on a separate one). Component: form-interest-expense.component.ts. Screen review 2026-11-09 (Form 4952 (2025) and
# its instructions): the statement upload questions, the line 4g election notes, the line 4e "Elec." amount, the joint/community
# questions and the AMT recompute question were removed with their columns (V446, owner 2026-11-09 - nothing read them). Schedule K-1
# code H interest and the K-1 investment income / expenses are added by the calculation (K1CodedItems.withForm4952); last year's line 7
# fills a blank line 2.
name: investment-interest-expense-deduction
title: Investment interest (Form 4952)
multiplicity: single
formName: Form 4952
category: deductions
instructions:
  - "Investment interest is deductible only up to net investment income; the rest carries forward."
sections:
  - name: gate
    title: Investment interest
    multiplicity: single
    fields:
      - name: needsForm4952
        type: boolean
        required: true
        label: "Did you pay interest on money borrowed for investments in the tax year, or have investment interest carried over from the prior year?"
  - name: interest
    title: Interest
    showIf: needsForm4952 == true
    multiplicity: single
    fields:
      - { name: investmentInterestExpensePaidOrAccruedLine1, type: amount, required: false, label: "Investment interest paid or accrued in the tax year (line 1)" }
      - { name: disallowedInvestmentInterestExpenseFrom2024Line2, type: amount, required: false, label: "Disallowed investment interest from the prior year (Form 4952 line 7) (line 2)", help: "Blank: last year's line 7 from a return done here." }
  - name: income
    title: Investment income
    showIf: needsForm4952 == true
    multiplicity: single
    fields:
      - { name: grossIncomeFromPropertyHeldForInvestmentLine4a, type: amount, required: false, label: "Gross income from property held for investment (line 4a)" }
      - { name: qualifiedDividendsIncludedInLine4aLine4b, type: amount, required: false, label: "Qualified dividends included above (line 4b)" }
      - { name: netGainFromDispositionOfInvestmentPropertyLine4d, type: amount, required: false, label: "Net gain from selling investment property (line 4d)" }
      - { name: netCapitalGainFromDispositionOfInvestmentPropertyLimit, type: amount, required: false, label: "Net capital gain part of that gain (line 4e cap)", help: "Blank: Schedule D line 15 less any line 7 loss." }
      - { name: investmentExpensesLine5, type: amount, required: false, label: "Investment expenses (line 5)" }
  - name: election
    title: Qualified dividends and capital gain
    showIf: needsForm4952 == true
    multiplicity: single
    fields:
      - { name: electToIncludeQualifiedDividendsOrCapitalGainInInvestmentIncome, type: boolean, required: false, label: "Do you want to include qualified dividends or net capital gain in investment income?" }
      - { name: electedInvestmentIncomeAmountLine4g, type: amount, required: false, showIf: electToIncludeQualifiedDividendsOrCapitalGainInInvestmentIncome == true, label: "Amount to include (line 4g)" }
  - name: parts
    title: Where the deduction goes
    showIf: needsForm4952 == true
    multiplicity: single
    instructions:
      - "Line 8 goes to Schedule A line 9 except these parts (Form4952Line8Parts; advisory FORM_4952_LINE8_ELSEWHERE)."
    fields:
      - { name: hasRoyaltiesInvestmentInterestPortion, type: boolean, required: false, label: "Is any of the deductible interest for royalties?" }
      - { name: royaltiesInvestmentInterestPortionAmount, type: amount, required: false, showIf: hasRoyaltiesInvestmentInterestPortion == true, label: "Part for royalties (Schedule E)" }
      - { name: hasNonPassiveBusinessInvestmentInterestPortion, type: boolean, required: false, label: "Is any of it for a trade or business that isn't a passive activity?" }
      - { name: nonPassiveBusinessInvestmentInterestPortionAmount, type: amount, required: false, showIf: hasNonPassiveBusinessInvestmentInterestPortion == true, label: "Part for the business" }
      - { name: hasAtRiskActivityInvestmentInterestPortion, type: boolean, required: false, label: "Is any of it for an activity you aren't at risk in?" }
      - { name: atRiskActivityInvestmentInterestPortionAmount, type: amount, required: false, showIf: hasAtRiskActivityInvestmentInterestPortion == true, label: "Part for that activity (Form 6198 line 4)" }
