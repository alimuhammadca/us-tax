# Form 1040 line 8 (Schedule 1 line 10) workflow for spouse.
# Approach: keep spouse-specific user questions + imported fields + computed outputs in one YAML.
# NOTE: Sections marked as backend-only are NOT supposed to be rendered in the actual form component.
# NOTE: Return-level upload confirmation and statement gating are intentionally kept on taxpayer form to avoid conflicts.
name: other-incomes-spouse
title: Form 1040 - Other incomes (spouse, line 8 via Schedule 1)
multiplicity: single
formName: 1040
category: income
instructions:
  - Use this form for spouse-specific Schedule 1 Part I amounts that contribute to Form 1040 line 8.
  - Return-level statement upload confirmations remain on the taxpayer Other incomes form.
  - Self-employment/business and farm income are out of scope and must be blocked.
sections:
  - name: screening
    title: Screening
    multiplicity: single
    fields:
      - name: hadAdditionalIncomeForSchedule1
        type: boolean
        required: true
        label: Did your spouse have additional income that belongs on Schedule 1 and Form 1040 line 8?
        help: If No, stop here and do not continue this workflow.

  - name: outOfScopeScreening
    title: Out-of-scope screening
    multiplicity: single
    showIf: hadAdditionalIncomeForSchedule1 == true
    instructions:
      - Schedule C and Schedule F paths are out of scope for this product.
    fields:
      - name: hasScheduleCBusinessIncomeOutOfScope
        type: boolean
        required: false
        label: Does spouse have Schedule C business income or loss for Schedule 1 line 3?
        help: Select Yes if Schedule C is required. This return will be blocked in this product.
      - name: hasScheduleFFarmIncomeOutOfScope
        type: boolean
        required: false
        label: Does spouse have Schedule F farm income or loss for Schedule 1 line 6?
        help: Select Yes if Schedule F is required. This return will be blocked in this product.
      - name: hasSection962CfcElection
        type: boolean
        required: false
        label: Has your spouse made a Section 962 election to be taxed at corporate rates on CFC income (Section 951 / 951A inclusions)?
        help: Select Yes if your spouse made a Section 962 election for controlled foreign corporation income. This product does not support Section 962 elections; please consult a tax professional.

  - name: schedule1Lines1to7
    title: Spouse Schedule 1 lines 1 through 7
    multiplicity: single
    showIf: hadAdditionalIncomeForSchedule1 == true
    fields:
      - name: form1099KPersonalItemsDisclosureAmount
        type: amount
        required: false
        label: Spouse Form 1099-K amount reported for personal items sold at a loss or reported in error (disclosure only — does not affect income)
        placeholder: 0.00
        help: Enter the amount from Form 1099-K if it represents spouse personal items sold at a loss or amounts reported in error. Disclosure only — does not add to taxable income.
      - name: taxableStateLocalRefundsLine1
        type: amount
        required: false
        label: Spouse taxable state and local refunds (line 1)
        placeholder: 0.00
        help: Enter spouse amount for Schedule 1 line 1.
      - name: alimonyReceivedLine2a
        type: amount
        required: false
        label: Spouse alimony received (line 2a)
        placeholder: 0.00
        help: Enter spouse taxable alimony received when applicable.
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: alimonyAgreementDateLine2b
        type: date
        required: false
        label: "Date of original divorce or separation agreement (line 2b)"
        showIf: "alimonyReceivedLine2a > 0"
      - name: alimonyModificationAdoptsTcja
        type: boolean
        required: false
        label: "Was the agreement changed after 2018, with the change expressly saying the new tax rules apply (alimony not taxable)?"
        showIf: "alimonyReceivedLine2a > 0"
      - name: otherGainsLossesLine4
        type: amount
        required: false
        label: Spouse other gains or losses (line 4)
        placeholder: 0.00
        help: Enter spouse gains or losses that map to Schedule 1 line 4.
      - name: rentalRealEstateRoyaltiesLine5
        type: amount
        required: false
        label: Spouse rental real estate, royalties, partnerships, S corps, trusts (line 5)
        placeholder: 0.00
        help: Enter spouse Schedule E amounts flowing to Schedule 1 line 5.
      - name: unemploymentCompensationLine7
        type: amount
        required: false
        label: Spouse unemployment compensation (line 7)
        placeholder: 0.00
        help: Enter spouse gross unemployment compensation before repayment adjustment.
      - name: repaidUnemploymentOverpaymentIn2025
        type: boolean
        required: false
        label: Did spouse repay unemployment compensation in 2025?
        help: Select Yes if spouse repaid a 2025 unemployment overpayment.
      - name: unemploymentRepaymentAdjustment
        type: amount
        required: false
        label: Spouse unemployment repayment adjustment amount
        placeholder: 0.00
        help: Enter spouse repayment amount used to reduce Schedule 1 line 7.
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: governmentalUnemploymentProgramContributions
        type: amount
        required: false
        label: "Contributions your spouse made to a governmental unemployment compensation program in 2025 (line 7)"
      - name: priorYearUnemploymentRepaidIn2025
        type: amount
        required: false
        label: "Unemployment benefits from an earlier year that your spouse paid back in 2025"

  - name: schedule1OtherIncome8
    title: Spouse Schedule 1 other income (line 8a through line 8v)
    multiplicity: single
    showIf: hadAdditionalIncomeForSchedule1 == true
    fields:
      - name: otherIncomeNetOperatingLoss8a
        type: amount
        required: false
        label: Spouse net operating loss (line 8a)
        placeholder: 0.00
        help: Enter as positive input; engine applies required negative sign.
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: otherIncomeNetOperatingLossPre2018Portion
        type: amount
        required: false
        label: "Part of the line 8a carryforward from NOLs that arose in tax years before 2018 (not subject to the 80% limit)"
        showIf: "otherIncomeNetOperatingLoss8a > 0"
      - name: atnolCarryforwardAmount
        type: amount
        required: false
        label: "Alternative Tax Net Operating Loss (ATNOL) carryforward for the AMT — only if it differs from the amount above"
        showIf: "otherIncomeNetOperatingLoss8a > 0"
      - name: otherIncomeGambling8b
        type: amount
        required: false
        label: Spouse gambling income (line 8b)
        placeholder: 0.00
        help: Enter spouse gambling income included on line 8b.
      - name: otherIncomeCancellationOfDebt8c
        type: amount
        required: false
        label: Spouse cancellation of debt (line 8c)
        placeholder: 0.00
        help: Enter spouse cancellation-of-debt income included on line 8c.
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: codExcludeUnderInsolvency
        type: boolean
        required: false
        label: "Was your spouse insolvent immediately before the debt was cancelled (total debts exceeded the value of everything they owned)?"
        showIf: "otherIncomeCancellationOfDebt8c > 0"
      - name: codTotalLiabilitiesBeforeDischarge
        type: amount
        required: false
        label: "Total liabilities (everything owed) immediately before the cancellation"
        showIf: "codExcludeUnderInsolvency == true"
      - name: codFmvAssetsBeforeDischarge
        type: amount
        required: false
        label: "Fair market value of all assets (everything owned) immediately before the cancellation"
        showIf: "codExcludeUnderInsolvency == true"
      - name: codExcludeQualifiedPrincipalResidence
        type: boolean
        required: false
        label: "Was the cancelled debt a mortgage used to buy, build, or substantially improve the main home?"
        showIf: "otherIncomeCancellationOfDebt8c > 0"
      - name: codQprExclusionAmount
        type: amount
        required: false
        label: "Amount of the cancelled main-home mortgage debt"
        showIf: "codExcludeQualifiedPrincipalResidence == true"
      - name: codMortgagePrincipalBeforeDischarge
        type: amount
        required: false
        label: "Loan balance just before the debt was cancelled"
        showIf: "codExcludeQualifiedPrincipalResidence == true"
      - name: codMortgageQpriPrincipal
        type: amount
        required: false
        label: "Part of that balance used to buy, build or improve your main home (a refinance counts only up to the old loan balance just before it)"
        showIf: "codExcludeQualifiedPrincipalResidence == true"
      - name: codHomeBasisBeforeReduction
        type: amount
        required: false
        label: "Cost basis in the home before this reduction (for the required basis reduction)"
        showIf: "codExcludeQualifiedPrincipalResidence == true"
      - name: codRetainedResidenceAfterDischarge
        type: boolean
        required: false
        label: "Did you still own the home after the debt was cancelled? (Answer No if it was foreclosed on, or sold as part of the cancellation.)"
        showIf: "codExcludeQualifiedPrincipalResidence == true"
      - name: codExcludeTitle11Bankruptcy
        type: boolean
        required: false
        label: "Was the debt cancelled in a bankruptcy case (Title 11)?"
        showIf: "otherIncomeCancellationOfDebt8c > 0"
      - name: codExcludeQualifiedFarm
        type: boolean
        required: false
        label: "Was the cancelled debt farm debt from a farming business?"
        showIf: "otherIncomeCancellationOfDebt8c > 0"
      - name: codFarmExclusionAmount
        type: amount
        required: false
        label: "Amount of the cancelled farm debt to exclude"
        showIf: "codExcludeQualifiedFarm == true"
      - name: codFarmGrossReceiptsTest
        type: boolean
        required: false
        label: "Did at least 50% of your gross receipts for 2022-2024 come from farming?"
        showIf: "codExcludeQualifiedFarm == true"
      - name: codFarmQualifiedLender
        type: boolean
        required: false
        label: "Was the debt canceled by a lender regularly in the business of lending (not a relative, the seller, or a promoter), or by a government?"
        showIf: "codExcludeQualifiedFarm == true"
      - name: codFarmDepreciablePropertyBasis
        type: amount
        required: false
        label: "Basis in farm equipment and other depreciable property (reduced first)"
        showIf: "codExcludeQualifiedFarm == true"
      - name: codFarmLandBasis
        type: amount
        required: false
        label: "Basis in farmland (reduced next)"
        showIf: "codExcludeQualifiedFarm == true"
      - name: codFarmOtherPropertyBasis
        type: amount
        required: false
        label: "Basis in other business or investment property (reduced last)"
        showIf: "codExcludeQualifiedFarm == true"
      - name: codExcludeQrpbi
        type: boolean
        required: false
        label: "Was the cancelled debt a mortgage on real property used in a trade or business?"
        showIf: "otherIncomeCancellationOfDebt8c > 0"
      - name: codQrpbiExclusionAmount
        type: amount
        required: false
        label: "Amount of the cancelled business-property debt to exclude"
        showIf: "codExcludeQrpbi == true"
      - name: codDepreciableRealPropertyBasis
        type: amount
        required: false
        label: "Basis in that depreciable real property before this reduction"
        showIf: "codExcludeQrpbi == true"
      - name: codElectSection108b5BasisFirst
        type: boolean
        required: false
        label: "Reduce the basis of depreciable property BEFORE the net operating loss? (Choosing this keeps the loss carryforward intact.)"
        showIf: "otherIncomeCancellationOfDebt8c > 0"
      - name: codDepreciablePropertyBasis
        type: amount
        required: false
        label: "Total basis in depreciable property available to reduce"
        showIf: "codElectSection108b5BasisFirst == true"
      - name: codElectSection1221Depreciable
        type: boolean
        required: false
        label: "Treat real property held for sale to customers as depreciable property? (Leave unanswered if it does not apply.)"
        showIf: "otherIncomeCancellationOfDebt8c > 0"
      - name: codPropertyBasisAfterDischarge
        type: amount
        required: false
        label: "Total basis of all property your spouse owns at the start of 2026 (for the Form 982 line 10a basis reduction)"
        showIf: "otherIncomeCancellationOfDebt8c > 0"
      - name: codMoneyAfterDischarge
        type: amount
        required: false
        label: "Your spouse's cash and bank balances right after the debt was cancelled (bankruptcy or insolvency only)"
        showIf: "otherIncomeCancellationOfDebt8c > 0"
      - name: codLiabilitiesAfterDischarge
        type: amount
        required: false
        label: "Your spouse's total liabilities right after the debt was cancelled (leave blank to use the liabilities before minus the cancelled debt)"
        showIf: "otherIncomeCancellationOfDebt8c > 0"
      - name: otherIncomeForeignEarnedIncomeExclusion8d
        type: amount
        required: false
        label: Spouse foreign earned income exclusion from Form 2555 (line 8d)
        placeholder: 0.00
        help: Enter as positive input; engine applies required negative sign.
      - name: otherIncomeForm88538e
        type: amount
        required: false
        label: Spouse income from Form 8853 (line 8e)
        placeholder: 0.00
        help: Enter spouse Form 8853 income flowing to line 8e.
      - name: otherIncomeForm88898f
        type: amount
        required: false
        label: Spouse income from Form 8889 (line 8f)
        placeholder: 0.00
        help: Enter spouse Form 8889 income flowing to line 8f.
      - name: otherIncomeAlaskaPermanentFundDividends8g
        type: amount
        required: false
        label: Spouse Alaska Permanent Fund dividends (line 8g)
        placeholder: 0.00
        help: Enter spouse taxable Alaska Permanent Fund dividends.
      - name: otherIncomeJuryDutyPay8h
        type: amount
        required: false
        label: Spouse jury duty pay (line 8h)
        placeholder: 0.00
        help: Enter spouse jury duty pay included on line 8h.
      - name: otherIncomePrizesAwards8i
        type: amount
        required: false
        label: Spouse prizes and awards (line 8i)
        placeholder: 0.00
        help: Enter spouse taxable prizes and awards.
      - name: otherIncomeHobbyIncome8j
        type: amount
        required: false
        label: Spouse activity not engaged in for profit income (line 8j)
        placeholder: 0.00
        help: Enter spouse hobby income reported on line 8j.
      - name: otherIncomeStockOptions8k
        type: amount
        required: false
        label: Spouse stock options (line 8k)
        placeholder: 0.00
        help: Enter spouse stock-option income not reported elsewhere.
      - name: otherIncomeRentalPersonalProperty8l
        type: amount
        required: false
        label: Spouse rental of personal property income (line 8l)
        placeholder: 0.00
        help: Enter spouse income from rental of personal property not reported on Schedule C/E.
      - name: otherIncomeOlympicParalympic8m
        type: amount
        required: false
        label: Spouse Olympic or Paralympic medals and prize money (line 8m)
        placeholder: 0.00
        help: Enter spouse taxable amount for line 8m.
      - name: otherIncomeSection951a8n
        type: amount
        required: false
        label: Spouse section 951(a) inclusion (line 8n)
        placeholder: 0.00
        help: Enter spouse section 951(a) inclusion amount.
      - name: otherIncomeSection951A8o
        type: amount
        required: false
        label: Spouse section 951A(a) inclusion (line 8o)
        placeholder: 0.00
        help: Enter spouse section 951A(a) inclusion amount.
      - name: otherIncomeSection461l8p
        type: amount
        required: false
        label: Spouse section 461(l) excess business loss adjustment (line 8p)
        placeholder: 0.00
        help: Enter spouse section 461(l) adjustment only when applicable.
      - name: otherIncomeAbleDistributions8q
        type: amount
        required: false
        label: Spouse taxable ABLE account distributions (line 8q)
        placeholder: 0.00
        help: Enter spouse taxable ABLE account distributions.
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: ableQualifiedDisabilityExpenses
        type: amount
        required: false
        label: "ABLE account: qualified disability expenses paid this year (Pub. 907 Table 1)"
      - name: form5329Line6ExceptionAmount
        type: amount
        required: false
        label: "ABLE/education distributions NOT subject to the 10% additional tax (Form 5329 line 6)"
      - name: qtpQualifiedEducationExpenses
        type: amount
        required: false
        label: "529 plan or Coverdell ESA (Form 1099-Q): qualified education expenses paid in 2025 (Pub. 970)"
      - name: qtpTaxFreeEducationAssistance
        type: amount
        required: false
        label: "529 plan or Coverdell ESA: tax-free scholarships, grants and other tax-free education help (Pub. 970)"
      - name: qtpRolledOverOrRecontributedAmount
        type: amount
        required: false
        label: "Part of your spouse's 2025 Form 1099-Q distributions rolled over to another 529 plan or ABLE account, or refunded and recontributed, within 60 days (Pub. 970)"
      - name: ableRolledOverWithin60DaysAmount
        type: amount
        required: false
        label: "Part of your spouse's 2025 Form 1099-QA distributions rolled over to another ABLE account within 60 days (Pub. 907)"
      - name: coverdellPriorYearExcessLine26
        type: amount
        required: false
        label: "Coverdell ESA: excess contributions carried from 2024 (2024 Form 5329 line 32, when its line 33 was more than zero)"
      - name: coverdellExcessContributions2025Line31
        type: amount
        required: false
        label: "Coverdell ESA: 2025 contributions over the $2,000 limit, not withdrawn before June 1, 2026 (Form 5329 line 31)"
      - name: coverdellRolloverOrWithdrawnExcessLine28
        type: amount
        required: false
        label: "Coverdell ESA: 2025 distributions that were rolled over within 60 days or were withdrawn excess contributions (Form 5329 line 28)"
      - name: coverdellYearEndValue
        type: amount
        required: false
        label: "Coverdell ESA: value of your spouse's Coverdell ESAs on December 31, 2025 (Form 5329 line 33)"
      - name: ableExcessContributions2025Line50
        type: amount
        required: false
        label: "ABLE account: 2025 contributions over the limit, not returned by the due date (Form 5329 line 50)"
      - name: ableYearEndValue
        type: amount
        required: false
        label: "ABLE account: value on December 31, 2025 (leave blank to use the Form 5498-QA fair market value) (Form 5329 line 51)"
      - name: otherIncomeScholarships8r
        type: amount
        required: false
        label: Spouse scholarships and fellowship grants not on Form W-2 (line 8r)
        placeholder: 0.00
        help: Enter spouse taxable scholarship and fellowship grant amounts.
      - name: otherIncomeNonqualifiedDeferredComp8t
        type: amount
        required: false
        label: Spouse pension or annuity from nonqualified deferred comp or nongovernmental 457 plan (line 8t)
        placeholder: 0.00
        help: Enter spouse line 8t income amount.
      - name: otherIncomeWagesWhileIncarcerated8u
        type: amount
        required: false
        label: Spouse wages earned while incarcerated (line 8u)
        placeholder: 0.00
        help: Enter spouse wages earned while incarcerated.
      - name: otherIncomeDigitalAssets8v
        type: amount
        required: false
        label: Spouse digital assets received as ordinary income not reported elsewhere (line 8v)
        placeholder: 0.00
        help: Enter spouse taxable ordinary digital-asset income not already reported.

  - name: otherIncomeItems8z
    title: Spouse other income items (line 8z)
    multiplicity: multiple
    showIf: hadAdditionalIncomeForSchedule1 == true
    instructions:
      - Add one row for each spouse line 8z item.
    fields:
      - name: description
        type: text
        required: true
        label: Description
        placeholder: Enter line 8z description
        help: Enter a short description for this spouse other income item.
      - name: amount
        type: amount
        required: true
        label: Amount
        placeholder: 0.00
        help: Enter amount for this spouse line 8z item.
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: isStateLocalTaxRefundForAmt
        type: boolean
        required: false
        label: "This is a refund of state/local property, sales, or foreign taxes I itemized in a prior year"
        showIf: "hadAdditionalIncomeForSchedule1 === true"

  # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
  - name: statementUploadCheck
    title: "Statement upload check"
    multiplicity: single
    fields:
      - name: received1099G
        type: boolean
        required: false
        label: "Did your spouse receive Form 1099-G?"
        showIf: "hadAdditionalIncomeForSchedule1 === true"
      - name: uploaded1099G
        type: boolean
        required: false
        label: "Has your spouse's 1099-G been uploaded in the Statements section?"
        showIf: "hadAdditionalIncomeForSchedule1 === true && received1099G === true"
      - name: received1099C
        type: boolean
        required: false
        label: "Did your spouse receive Form 1099-C (Cancellation of Debt)?"
        showIf: "hadAdditionalIncomeForSchedule1 === true"
      - name: uploaded1099C
        type: boolean
        required: false
        label: "Has your spouse's 1099-C been uploaded in the Statements section?"
        showIf: "hadAdditionalIncomeForSchedule1 === true && received1099C === true"
      - name: confirmAllReceivedOtherIncomeStatementsUploaded
        type: boolean
        required: false
        label: "I confirm every income statement my spouse received (1099-G, 1099-C, and any other government payment forms) has been uploaded"
        showIf: "hadAdditionalIncomeForSchedule1 === true && !isFullyAutoDetected()"

  # Backend-only computed outputs. Not rendered in the actual form component.
  - name: computedOutputs
    title: Computed outputs (backend only)
    multiplicity: single
    showIf: hadAdditionalIncomeForSchedule1 == true
    fields:
      - name: computedSchedule1Line9TotalOtherIncomeContribution
        type: amount
        required: false
        readOnly: true
        label: Computed spouse contribution to Schedule 1 line 9 total other income
      - name: computedSchedule1Line10TotalAdditionalIncomeContribution
        type: amount
        required: false
        readOnly: true
        label: Computed spouse contribution to Schedule 1 line 10 total additional income
