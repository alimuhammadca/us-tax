# Form 8283 - Noncash Charitable Contributions (return-level).
# Component: form-form-8283.component.ts (formId = form-8283).
name: form-8283
title: "Form 8283 - Noncash Charitable Contributions"
multiplicity: single
formName: "Form 8283"
category: "deductions"
sections:
  - name: screening
    title: "Screening"
    multiplicity: single
    fields:
      - name: hasNoncashDonations
        type: boolean
        required: true
        label: "Did you make any noncash charitable contributions?"

  - name: donations
    title: "Donated property (one row per item or group of similar items)"
    multiplicity: multiple
    showIf: "hasNoncashDonations == true"
    fields:
      - name: doneeName
        type: text
        required: false
        label: "(a) Donee organization name"
      - name: doneeAddress
        type: text
        required: false
        label: "(a) Donee address"
      - name: givenBy
        type: select
        required: false
        label: "Given by"
        options: ["taxpayer", "spouse", "joint"]
        showIf: "married (V438, owner 2026-11-08): a separate return keeps that spouse's gifts and half of the joint ones"
      - name: description
        type: text
        required: false
        label: "(c) Description and condition of donated property"
      - name: isVehicle
        type: boolean
        required: false
        label: "(b) Donated vehicle"
      - name: vehicleVin
        type: text
        required: false
        label: "(b) Vehicle identification number"
        showIf: "isVehicle == true"
      - name: dateContributed
        type: date
        required: false
        label: "(d) Date of contribution"
      - name: dateAcquired
        type: date   # YYYY-MM-DD, or "Various" (similar items all held 12 months or more); old "MM/DD/YYYY" text is read as a date
        required: false
        label: "(e) Date acquired by donor"
      - name: howAcquired
        type: text
        required: false
        label: "(f) How acquired by donor"
      - name: costBasis
        type: number
        required: false
        label: "(g) Donor's cost or adjusted basis"
      - name: fairMarketValue
        type: number
        required: false
        label: "(h) Fair market value"
      - name: fmvMethod
        type: text
        required: false
        label: "(i) Method used to determine fair market value"
      - name: isPubliclyTradedSecurity
        type: boolean
        required: false
        label: "Publicly traded security"
      - name: bargainSaleAmountReceived
        type: number
        required: false
        label: "Amount the charity paid you, if you sold it to them for less than its value (bargain sale)"
      - name: propertyCategory
        type: select
        required: false
        label: "Type of property"
        options: ["CLOTHING", "HOUSEHOLD_FURNITURE", "ELECTRONICS", "BOOKS", "ART", "COLLECTIBLES", "JEWELRY", "VEHICLE", "EQUIPMENT", "NONPUBLIC_STOCK", "DIGITAL_ASSETS", "INTELLECTUAL_PROPERTY", "LAND", "BUILDINGS", "OTHER"]
        showIf: "isPubliclyTradedSecurity != true"
      - name: goodUsedCondition
        type: boolean
        required: false
        label: "Is it in good used condition or better?"
        showIf: "propertyCategory in [CLOTHING, HOUSEHOLD_FURNITURE, ELECTRONICS] (V438, owner 2026-11-08)"
      - name: hasQualifiedAppraisal
        type: boolean
        required: false
        label: "I have a qualified appraisal for this gift"
        showIf: "qualified appraisal required (Section B property)"
