# Form 8396 (2025) - Mortgage interest credit (spouse). Joint return: interest added to the one Form 8396 (line 1); separate return:
# the spouse's own certificate under the same keys (MfsFormScoper). Screen review 2026-11-09: the issuer and issue date (V451).
name: mortgage-interest-credit-spouse
title: Mortgage interest credit (Form 8396)
multiplicity: single
formName: Form 8396
category: credits
sections:
  - name: gate
    title: Interest your spouse paid (joint) / The credit (separate)
    multiplicity: single
    fields:
      - { name: spouseHasMortgageInterestCreditInputs, type: boolean, required: true, label: "Joint: Did your spouse pay interest on the certified mortgage that isn't in the Family Head's amount? Separate: Does your spouse claim a mortgage interest credit on their separate return?" }
      - { name: spouseMortgageInterestPaidContribution, type: amount, required: false, showIf: "joint return and spouseHasMortgageInterestCreditInputs == true", label: "Interest your spouse paid on the certified mortgage, not in the Family Head's amount" }
  - name: eligibility
    title: The credit
    multiplicity: single
    showIf: spouseHasMortgageInterestCreditInputs (separate return) == true
    fields:
      - { name: hasQualifiedMortgageCreditCertificate, type: boolean, required: false, label: "Was the certificate issued by a state or local government unit or agency under a qualified mortgage credit certificate program?" }
      - { name: mainHomeWithinMccJurisdiction, type: boolean, required: false, label: "Is the home your spouse's main home, in the area of the government unit that issued the certificate?" }
      - { name: interestPaidToRelatedPerson, type: boolean, required: false, label: "Was the mortgage interest paid to a related person?" }
  - name: certificate
    title: The certificate
    multiplicity: single
    showIf: eligible (a qualified certificate, the main home, no related-person interest)
    fields:
      - { name: mccIssuerName, type: string, required: false, label: "Name of the issuer" }
      - { name: mccCertificateNumber, type: string, required: false, label: "Certificate number" }
      - { name: mccIssueDate, type: date, required: false, label: "Date the certificate was issued" }
      - { name: mccHomeAddress, type: string, required: false, label: "Address of the home, if not the address on the return" }
      - { name: certificateCreditRatePercent, type: percent, required: false, label: "Certificate credit rate (line 2)", note: "10%-50%; outside it no credit" }
  - name: interest
    title: Interest paid (line 1)
    multiplicity: single
    showIf: eligible
    fields:
      - { name: totalMortgageInterestPaid, type: amount, required: false, label: "Interest paid on the certified mortgage (Form 1098 box 1)" }
      - { name: certifiedIndebtednessAmount, type: amount, required: false, label: "Loan amount on the certificate" }
      - { name: originalMortgageAmount, type: amount, required: false, label: "Whole mortgage loan amount" }
      - { name: certifiedMortgageInterestPaidOverride, type: amount, required: false, label: "Interest on the covered loan, if figured yourself" }
      - { name: nonSpouseOwnerSharePercent, type: percent, required: false, label: "Your spouse's share of the home, if it has another owner" }
  - name: carryforward
    title: Credit carried forward from earlier years (lines 4-6)
    multiplicity: single
    showIf: eligible
    fields:
      - { name: carryforward2022From2024Form8396Line16, type: amount, required: false, label: "2022 credit (line 16 of the 2024 Form 8396)" }
      - { name: carryforward2023From2024Form8396Line14, type: amount, required: false, label: "2023 credit (line 14 of the 2024 Form 8396)" }
      - { name: carryforward2024From2024Form8396Line17, type: amount, required: false, label: "2024 credit (line 17 of the 2024 Form 8396)" }
