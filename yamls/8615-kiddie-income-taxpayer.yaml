# Form 8615 (Kiddie income) - the dependent's answers (kiddie-income-dependent, saved per dependent; kiddie-income-taxpayer is the
# legacy household copy). Form 8615 is figured on the child's own return (dependent_own): line 1 from the Child's Unearned Income
# Worksheet / Alternate Worksheet (Form8615Line1), lines 6-7 and the parents' filing status from the parents' and siblings' returns.
# Screen review 2026-11-07 (owner): the screen asks only what that return can't work out; the typed lines 1-7 / 13 / 14 / 18, the
# child's filing status and "Does the kiddie tax apply?" (hasKiddieTaxUnearnedIncome) were never read there - removed and cleared on
# save (columns kept). Labels are worded for the dependent; help in data/kiddie-income-help.ts.
name: kiddie-income-dependent
title: Kiddie income
multiplicity: single
formName: 8615
category: income

sections:
  - name: kiddieTax
    title: Kiddie tax
    multiplicity: single
    fields:
      - name: parentAliveEndOfYear
        type: boolean
        required: true
        label: "Was at least one of the child's parents alive at the end of 2025?"
        help: "Form 8615 Who Must File condition 4 (V436). No: no Form 8615."

  - name: support
    title: Support
    multiplicity: single
    showIf: "parentAliveEndOfYear != false && the child is 18-23 at the end of the year (or the age is unknown)"
    fields:
      - name: earnedIncomeMoreThanHalfOfSupport
        type: boolean
        required: false
        label: "Was the child's earned income (pay for work) more than half of the child's own support for 2025?"
        help: "Condition 3b / 3c: Yes means no Form 8615 for a child of 18, or a full-time student 19-23."

  - name: itemizedDeductions
    title: Itemized deductions
    multiplicity: single
    showIf: parentAliveEndOfYear != false
    fields:
      - name: childItemizedDeductionLine2
        type: amount
        required: false
        label: "Only if the child itemizes: deductions directly connected with the unearned income"
        help: "Line 2: the larger of $2,700 or $1,350 plus this amount (passed to the child's return since 2026-11-07)."
