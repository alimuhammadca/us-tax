# Form 8615 (Kiddie income) - the dependent's answers (kiddie-income-dependent, saved per dependent; kiddie-income-taxpayer is the
# legacy household copy). Form 8615 is figured on the child's own return (dependent_own): line 1 from the Child's Unearned Income
# Worksheet / Alternate Worksheet (Form8615Line1), lines 6-7 and the parents' filing status from the parents' and siblings' returns.
# Screen review 2026-11-07 (owner): the screen asks only what that return can't work out; the typed lines 1-7 / 13 / 14 / 18, the
# child's filing status and "Does the kiddie tax apply?" (hasKiddieTaxUnearnedIncome) were never read there - removed and cleared on
# save (columns kept). Labels are worded for the dependent; help in data/kiddie-income-help.ts.
name: kiddie-income-dependent
title: Kiddie income
multiplicity: single
formName: 8615
category: income

sections:
  - name: kiddieTax
    title: Kiddie tax
    multiplicity: single
    fields:
      - name: parentAliveEndOfYear
        type: boolean
        required: true
        label: "Was at least one of the child's parents alive at the end of 2025?"
        help: "Form 8615 Who Must File condition 4 (V436). No: no Form 8615."

  - name: scheduleBPartIII
    title: Foreign accounts and trusts
    multiplicity: single
    note: "V589 (2026-11-27, owner-approved): Schedule B Part III for the child's own return - required once the child's interest or ordinary dividends are over $1,500, and an unanswered Part III can't be overridden. The dependent's tab has no Interest income screen."
    fields:
      - name: hasForeignAccountForScheduleBPartIII
        type: boolean
        required: false
        label: "At any time during 2025, did the child have a financial interest in, or signature authority over, a financial account in a foreign country?"
        help: "Schedule B line 7a."
      - name: hasFbarRequirement
        type: boolean
        required: false
        showIf: hasForeignAccountForScheduleBPartIII == true
        label: "Is the child required to file FinCEN Form 114 (FBAR) to report that account?"
        help: "Schedule B line 7a, second question (more than $10,000 in foreign accounts at any time in 2025)."
      - name: hasForeignTrustDistributionOrTransfer
        type: boolean
        required: false
        label: "During 2025, did the child receive a distribution from, or was the child the grantor of, or transferor to, a foreign trust?"
        help: "Schedule B line 8."

  - name: support
    title: Support
    multiplicity: single
    showIf: "parentAliveEndOfYear != false && the child is 18-23 at the end of the year (or the age is unknown)"
    fields:
      - name: earnedIncomeMoreThanHalfOfSupport
        type: boolean
        required: false
        label: "Was the child's earned income (pay for work) more than half of the child's own support for 2025?"
        help: "Condition 3b / 3c: Yes means no Form 8615 for a child of 18, or a full-time student 19-23."

  - name: itemizedDeductions
    title: Itemized deductions
    multiplicity: single
    showIf: parentAliveEndOfYear != false
    fields:
      - name: childItemizedDeductionLine2
        type: amount
        required: false
        label: "Only if the child itemizes: deductions directly connected with the unearned income"
        help: "Line 2: the larger of $2,700 or $1,350 plus this amount (passed to the child's return since 2026-11-07)."
      # V522 (owner-approved 2026-11-19): Instructions for Form 8615, Earned income
      - name: businessCapitalMaterial
        type: boolean
        required: false
        label: "If the child has a business or farm: do both capital and the child's own work produce its income?"
      - name: businessServicesAllowance
        type: amount
        required: false
        showIf: businessCapitalMaterial == true
        label: A reasonable amount to pay someone for the child's work in the business
        help: Earned at most 30% of the net profit after half the self-employment tax (blank uses the 30%); the rest of the profit is unearned on line 1.
      - name: qualifiedDisabilityTrustDistributions
        type: amount
        required: false
        label: Taxable distributions from a qualified disability trust included in the child's income
        help: Earned income for Form 8615 - taken off line 1.
