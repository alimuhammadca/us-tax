# Form 8801 - Prior-year minimum tax credit (spouse). Component: form-prior-min-tax-credit.component.ts. Screen review 2026-11-09
# (Instructions for Form 8801 (2025)): the "worksheets available" question was removed with its column (V447, owner 2026-11-09);
# labels name the prior-year lines the calculation reads; line 3 is subtracted; line 4 MFS addition; line 51 = 27 - 50; the Foreign
# Earned Income Tax Worksheet subtracts the tax on line 2c; last year's line 26 fills line 19 (the 19th bridge).
# Joint return: only the gate and the spouse's line 2c part; separate return: the spouse's own complete Form 8801 (MfsFormScoper).
name: prior-min-tax-credit-spouse
title: Prior-year minimum tax credit (Form 8801)
multiplicity: single
formName: Form 8801
category: credits
sections:
  - name: claim
    title: Claiming the credit
    multiplicity: single
    fields:
      - { name: spouseHasPriorMinTaxCreditInputs, type: boolean, required: true, label: "Joint: Did your spouse exclude foreign earned income or housing on a prior-year Form 2555? Separate: Did your spouse pay AMT for the prior year, or have a minimum tax credit carried forward?" }
      - { name: priorYearFeitwLine3Spouse, type: amount, required: false, showIf: spouseHasPriorMinTaxCreditInputs == true && filingStatus != 'Married filing separately', label: "Prior-year Form 2555 exclusions (worksheet line 2c)" }
  - name: amt
    title: 2024 alternative minimum tax
    showIf: spouseHasPriorMinTaxCreditInputs == true && filingStatus == 'Married filing separately'
    multiplicity: single
    fields:
      - { name: priorYearFilingStatus, type: select, required: false, label: "Your spouse's prior-year filing status", help: "Blank: this year's filing status." }
      - { name: priorYearForm6251Line1Plus2e, type: amount, required: false, label: "Prior-year Form 6251 lines 1 and 2e combined (Form 8801 line 1; may be negative)" }
      - { name: priorYearExclusionItemAdjustments, type: amount, required: false, label: "Exclusion items (line 2: prior-year Form 6251 lines 2a, 2b, 2c, 2d, 2g, 2h)" }
      - { name: priorYearMtcnold, type: amount, required: false, label: "Minimum tax credit NOL deduction (line 3; entered positive, subtracted)" }
      - { name: priorYearMtftceOnExclusionItems, type: amount, required: false, label: "Minimum tax foreign tax credit on exclusion items (line 12)" }
      - { name: priorYearForm6251Line10, type: amount, required: false, label: "Prior-year Form 6251 line 10 - regular tax (Form 8801 line 14)" }
      - { name: priorYearForm6251Line11, type: amount, required: false, label: "Prior-year Form 6251 line 11 - AMT (Form 8801 line 16)" }
  - name: carry
    title: Credit carried over
    showIf: spouseHasPriorMinTaxCreditInputs == true && filingStatus == 'Married filing separately'
    multiplicity: single
    fields:
      - { name: priorYearForm8801Line26Carryforward, type: amount, required: false, label: "Credit carried forward (prior-year Form 8801 line 26 -> line 19)", help: "Blank: last year's line 26 from a return done here (Form8801Rules)." }
      - { name: priorYearUnallowedQualifiedElectricVehicleCredit, type: amount, required: false, label: "Unallowed qualified electric vehicle credit (line 20)" }
  - name: special
    title: Capital gains and foreign income in the prior year
    showIf: spouseHasPriorMinTaxCreditInputs == true && filingStatus == 'Married filing separately'
    multiplicity: single
    fields:
      - { name: priorYearFiledForm2555, type: boolean, required: false, label: "Filed Form 2555 for the prior year?" }
      - { name: priorYearFeitwLine3Spouse, type: amount, required: false, showIf: priorYearFiledForm2555 == true, label: "Prior-year Form 2555 exclusions (Foreign Earned Income Tax Worksheet line 2c)", help: "Line 27 = line 10 + both spouses' 2c parts; line 11 subtracts the tax on 2c." }
      - { name: priorYearUsesPartIII, type: boolean, required: false, label: "Qualified dividends, capital gain distributions on Form 1040 line 7, or a gain on both Schedule D lines 15 and 16?" }
      - { name: partIIILine28Amount, type: amount, required: false, showIf: priorYearFiledForm2555 == true || priorYearUsesPartIII == true, label: "Part III line 28" }
      - { name: partIIILine29Amount, type: amount, required: false, showIf: priorYearFiledForm2555 == true || priorYearUsesPartIII == true, label: "Part III line 29 (prior-year Schedule D line 19)" }
      - { name: partIIILine30CapAmount, type: amount, required: false, showIf: priorYearFiledForm2555 == true || priorYearUsesPartIII == true, label: "Part III line 30 limit (Schedule D Tax Worksheet line 10)" }
      - { name: partIIILine35Amount, type: amount, required: false, showIf: priorYearFiledForm2555 == true || priorYearUsesPartIII == true, label: "Part III line 35" }
      - { name: partIIILine42Amount, type: amount, required: false, showIf: priorYearFiledForm2555 == true || priorYearUsesPartIII == true, label: "Part III line 42" }
