formId: form8862
# Field entries also carry name: (= id:) so scripts/yaml-drift.py can match them to the component model keys.
# Screen review 2026-11-10 (owner, V462): Form 8862 is built from the return (backend Form8862Facts). Line 2 is worked out from the
# prior-disallowance answers on Earned income credit, Child Tax Credit settings and Education credits (the opening question, the
# three "reclaiming?" questions and the denial year are removed; filedWithReturn / claims* are saved as worked out). Part II follows
# the form's lines; Part III people come from Dependents with only line 17 asked; Part IV comes from Form 8863 lines 23-26 (the typed
# CTC rows and students are removed). Component: form-form8862.component.ts; help: data/credits-after-disallowance-help.ts.
# The spouse copy (form8862-spouse) is the spouse's own separate return; on a joint return it points to the Family Head's copy.
title: Credits after disallowance (Form 8862)
description: >
  Information To Claim Certain Credits After Disallowance - attached when the EIC, CTC/ACTC/ODC or AOTC was reduced or disallowed
  for an earlier year (not for a math or clerical error) and the credit is claimed again.

sections:
  - id: lineTwo
    title: Credits disallowed before (line 2)
    fields:
      - id: filedWithReturn
        name: filedWithReturn
        type: boolean
        readOnly: true
        computed: true
        label: "Worked out - Yes when any credit needs Form 8862 (question removed 2026-11-10)"
      - id: claimsEIC
        name: claimsEIC
        type: boolean
        readOnly: true
        computed: true
        label: "Worked out from Earned income credit: disallowed before and Form 8862 needed"
      - id: claimsCTC
        name: claimsCTC
        type: boolean
        readOnly: true
        computed: true
        label: "Worked out from Child Tax Credit settings"
      - id: claimsAOTC
        name: claimsAOTC
        type: boolean
        readOnly: true
        computed: true
        label: "Worked out from Education credits"

  - id: partTwo
    title: Earned income credit (Part II)
    showIf: "claimsEIC === true"
    fields:
      - id: eicLine3OnlyIncomeError
        name: eicLine3OnlyIncomeError
        label: Was the only reason the credit was reduced or disallowed that you reported the earned income or investment income incorrectly? (line 3)
        type: boolean
      - id: people.eicDaysInUs
        name: people.eicDaysInUs
        label: Days each child lived with you in the United States (line 7) - one per EIC child from Dependents and Earned income credit, saved by key (SSN digits or name)
        type: number
        showIf: "eicLine3OnlyIncomeError === false"
      - id: daysMainHomeInUsYou
        name: daysMainHomeInUsYou
        label: Days your main home was in the United States (line 9a)
        type: number
        showIf: "eicLine3OnlyIncomeError === false && no child has 183 days"
      - id: daysMainHomeInUsSpouse
        name: daysMainHomeInUsSpouse
        label: Days your spouse's main home was in the United States (line 9b, joint return)
        type: number
        showIf: "eicLine3OnlyIncomeError === false && no child has 183 days && married filing jointly"
    readFrom:
      line4: Earned income credit - couldBeQualifyingChildOfAnother (No on a joint return)
      lines5to8: Dependents and the Earned income credit typed children; line 8 births from the date of birth
      line10: Identification dates of birth (IRS age at the end of the year)
      line11: Standard or itemized deductions - someoneCanClaimYou / someoneCanClaimSpouse

  - id: partThree
    title: Child tax credit and credit for other dependents (Part III)
    showIf: "claimsCTC === true"
    fields:
      - id: people.usCitizen
        name: people.usCitizen
        label: Is <name> a U.S. citizen, U.S. national or U.S. resident? (line 17) - one per dependent qualifying for the CTC or the ODC
        type: boolean
    readFrom:
      line12: Dependents with qualifiesForCTC
      line13: Dependents with qualifiesForODC (not CTC)
      lines14to16: Yes for those dependents (Dependents certifies residency or its exception, the requirements, and the claim)

  - id: partFour
    title: American opportunity credit (Part IV)
    showIf: "claimsAOTC === true"
    readFrom:
      line18: Education credits students claiming the AOTC
      line19a: Form 8863 line 24 Yes, line 25 No and line 26 No
      line19b: Form 8863 line 23

  - id: computedOutputs
    readOnly: true
    computed: true
    fields:
      - id: fields
        name: fields
        type: object
        label: The whole Form 8862 by semantic field name (out_form_8862.form_json)
      - id: missing
        name: missing
        type: list
        label: What the screen still needs before a blocked credit can be claimed
