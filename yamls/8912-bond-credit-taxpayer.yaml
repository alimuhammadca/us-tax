# Form 8912 (Rev. December 2024) - Credit for tax credit bonds (Family Head). Component: form-bond-credit.component.ts. Screen review
# 2026-11-09: Part III comes from the Forms 1097-BTC on Statements (box 1) - the typed copy of those rows (taxpayer1097BtcEntries /
# spouse1097BtcEntries) was removed from the screen and is no longer read (owner 2026-11-09; Form8912Statements); line 7 is Form 1040
# line 16 + Schedule 2 line 1z; the bond type is a pick list (the 70% rule matched only the codes). Last year's carryforward fills line 3.
name: bond-credit-taxpayer
title: Credit for tax credit bonds (Form 8912)
multiplicity: single
formName: Form 8912
category: credits
sections:
  - name: claim
    title: Claiming the credit
    multiplicity: single
    fields:
      - { name: claimsBondCredit, type: boolean, required: true, label: "Did you hold a tax credit bond in the tax year?", help: "Filled with Yes when a Form 1097-BTC is entered." }
      - { name: priorYearCarryforwardCredit, type: amount, required: false, showIf: claimsBondCredit == true, label: "Unused credit carried from the prior year (line 3)" }
  - name: bonds
    title: Bonds without a Form 1097-BTC (Part IV)
    showIf: claimsBondCredit == true
    multiplicity: multiple
    listKey: taxpayerDirectBondEntries
    fields:
      - { name: bondType, type: select, required: false, options: [CREB, NCREB, QECB, QZAB, QSCB, BAB], label: "Bond type (line 20: 70% for NCREB / QECB)" }
      - { name: issuerName, type: text, required: false, label: "Issuer name (line 15a)" }
      - { name: issuerCityState, type: text, required: false, label: "Issuer city or town and state (line 15a)" }
      - { name: issuerEin, type: ein, required: false, label: "Issuer EIN (line 15b)" }
      - { name: issueDate, type: date, required: false, label: "Date issued (line 16a)", help: "After 2017: no credit." }
      - { name: maturityDate, type: date, required: false, label: "Date it matures (line 16b)" }
      - { name: disposalDate, type: date, required: false, label: "Date disposed of (line 17)" }
      - { name: cusipOrPaymentDates, type: text, required: false, label: "CUSIP number or payment dates (line 18 (a))" }
      - { name: basisAmount, type: amount, required: false, label: "Outstanding principal / BAB interest payable (line 18 (b))" }
      - { name: creditRatePercent, type: percent, required: false, label: "Credit rate (line 18 (c))" }
      - { name: allocationPercentage, type: percent, required: false, label: "Percentage for the year (line 18 (e))" }
      - { name: line19BaseCreditAmount, type: amount, required: false, label: "Credit figured (line 18 (f))", help: "Blank: principal x rate x percentage." }
