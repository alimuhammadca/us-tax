# Form 8936 / Schedule A (Form 8936) - Clean vehicle credit (Family Head). Component: form-clean-car-credit.component.ts. Screen review
# 2026-11-09 (Instructions for Form 8936 (2025)): the "seller reports and support ready" confirmation was removed with its column (V448,
# owner 2026-11-09); no credit for a vehicle acquired after September 30, 2025; a transferred credit is not claimed again and is repaid on
# Schedule 2 line 1b / 1c when the vehicle doesn't qualify (CleanVehicleRules); MAGI lines 1b-1d figured from the return when blank.
name: clean-car-credit-taxpayer
title: Clean vehicle credit (Form 8936)
multiplicity: single
formName: Form 8936
category: credits
sections:
  - name: claim
    title: Claiming the credit
    multiplicity: single
    fields:
      - { name: claimsCleanCarCreditOnReturn, type: boolean, required: true, label: "Did you buy a new or used clean vehicle (electric, plug-in hybrid or fuel cell) and start using it in the tax year?" }
  - name: income
    title: Income limit
    showIf: claimsCleanCarCreditOnReturn == true
    multiplicity: single
    fields:
      - { name: priorYearMagi, type: amount, required: false, label: "Prior-year modified AGI (Form 8936 line 3a)", help: "Blank with this year over the limit: not allowed." }
      - { name: currentYearAdditionalMagiAddbacks, type: amount, required: false, label: "Excluded income added to AGI (lines 1b-1d)", help: "Blank: figured from the return." }
  - name: vehicles
    title: Vehicles
    showIf: claimsCleanCarCreditOnReturn == true
    multiplicity: multiple
    listKey: taxpayerVehicles
    fields:
      - { name: vehicleNickname, type: text, required: false, label: "Name for this vehicle (not on the form)" }
      - { name: creditPath, type: select, required: false, options: ["New clean vehicle", "Previously owned clean vehicle"], label: "New or previously owned (Schedule A line 5 / 6)" }
      - { name: vehicleVin, type: text, required: false, label: "Vehicle identification number (line 2)" }
      - { name: vehicleYear, type: number, required: false, label: "Model year (line 1a)" }
      - { name: vehicleMake, type: text, required: false, label: "Make (line 1b)" }
      - { name: vehicleModel, type: text, required: false, label: "Model (line 1c)" }
      - { name: vehicleAcquiredDate, type: date, required: false, label: "Date acquired - written binding contract and a payment (the September 30 cutoff)" }
      - { name: vehiclePlacedInServiceDate, type: date, required: false, label: "Date placed in service - took possession (line 3)" }
      - { name: sellerReportReceived, type: boolean, required: false, label: "Got the seller's report?", help: "No: no credit (CleanVehicleRules)." }
      - { name: creditTransferredToDealer, type: boolean, required: false, label: "Credit transferred to the dealer at the time of sale? (line 4a)" }
      - { name: transferredCreditAmount, type: amount, required: false, showIf: creditTransferredToDealer == true, label: "Amount transferred (seller's report)", help: "Not claimed again; repaid on Schedule 2 line 1b / 1c when line 4b is checked." }
      - { name: resoldWithin30Days, type: boolean, required: false, label: "Resold within 30 days of the date placed in service? (line 8a / 13a)" }
      - { name: newVehicleAcquiredForUseOrLeaseNotResale, type: boolean, required: false, showIf: creditPath == 'New clean vehicle', label: "Acquired for use or to lease to others, not for resale? (line 8e)" }
      - { name: newVehicleType, type: radio, required: false, showIf: creditPath == 'New clean vehicle', options: [CAR, VAN_SUV_PICKUP], label: "Vehicle class (MSRP $55,000 / $80,000)" }
      - { name: newVehicleMsrp, type: amount, required: false, showIf: creditPath == 'New clean vehicle', label: "Manufacturer's suggested retail price" }
      - { name: newVehicleTentativeCreditAmount, type: amount, required: false, showIf: creditPath == 'New clean vehicle', label: "Tentative credit (seller's report; line 9)" }
      - { name: businessUsePercentage, type: percent, required: false, showIf: creditPath == 'New clean vehicle', label: "Business or investment use % (line 10)" }
      - { name: previouslyOwnedAcquiredForUseNotResale, type: boolean, required: false, showIf: creditPath == 'Previously owned clean vehicle', label: "Acquired for use, not for resale? (line 13f)" }
      - { name: previouslyOwnedSalesPrice, type: amount, required: false, showIf: creditPath == 'Previously owned clean vehicle', label: "Sales price (line 14; at most $25,000)" }
      - { name: previouslyOwnedClaimedInPrior3Years, type: boolean, required: false, showIf: creditPath == 'Previously owned clean vehicle', label: "Claimed the used credit for another vehicle bought in the 3 years before this one? (line 13d)" }
      - { name: previouslyOwnedCanBeClaimedAsDependent, type: boolean, required: false, showIf: creditPath == 'Previously owned clean vehicle', label: "Can someone claim you as a dependent? (line 13g)" }
