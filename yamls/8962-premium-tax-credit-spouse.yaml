# Form 8962 (2025) - Premium tax credit (spouse). Only on a separate return (her own Form 8962; MfsFormScoper un-prefixes the
# spousePtc* keys onto her leg). On a joint return the screen only points to the Family Head's. Screen review 2026-11-09: the joint
# Form 2555 add-backs and the confirmation were removed (V453); her own months-with-no-credit, noncitizen and Part IV answers added
# to the screen (the mapper already had Part IV; spousePtcIneligibleCoverageMonths is new in the mapper, same column).
name: premium-tax-credit-spouse
title: Premium tax credit (Form 8962)
multiplicity: single
formName: Form 8962
category: credits
sections:
  - name: coverage
    title: Marketplace coverage
    multiplicity: single
    showIf: "married filing separately"
    fields:
      - { name: spousePtcClaimsOrReceivedPtc, type: boolean, required: true, label: "Was your spouse enrolled in a health plan through the Marketplace in 2025?" }
  - name: household
    title: Tax family
    multiplicity: single
    showIf: spousePtcclaimsOrReceivedPtc == true
    fields:
      - { name: spousePtctaxFamilySize, type: integer, required: false, label: "Tax family size (line 1)", note: "blank: figured from the return" }
      - { name: spousePtcfplRegion, type: select, options: [continental, alaska, hawaii], required: false, label: "Poverty table (line 4)", note: "blank: from the address" }
      - { name: spousePtcmfsException, type: boolean, required: false, showIf: "married filing separately", label: "Domestic abuse / spousal abandonment exception (line A)" }
      - { name: spousePtcnoncitizenMarketplaceCoverage, type: boolean, required: false, label: "Anyone enrolled lawfully present and not eligible for Medicaid because of immigration status?" }
  - name: months
    title: Months with no credit
    multiplicity: single
    showIf: spousePtcclaimsOrReceivedPtc == true
    fields:
      - { name: spousePtcineligibleCoverageMonths, type: months, required: false, label: "Months when everyone on the plan could get other coverage or had affordable job-based coverage" }
      - { name: spousePtcqsehraAffordable, type: boolean, required: false, showIf: "a Form W-2 shows box 12 code FF", label: "Is the QSEHRA affordable (Pub. 974 Worksheet N)?" }
      - { name: spousePtcqsehraMonths, type: months, required: false, showIf: "a Form W-2 shows box 12 code FF", label: "Months the QSEHRA was provided" }
  - name: shared
    title: Policy shared with another return (Part IV)
    multiplicity: single
    showIf: spousePtcclaimsOrReceivedPtc == true
    fields:
      - { name: spousePtchasSharedPolicyAllocation, type: boolean, required: false, label: "Did a policy cover someone on another tax return, or someone on this return through another family's policy?" }
  - name: spousePtcSharedPolicyAllocation
    title: Allocation
    multiplicity: multiple
    max: 4
    showIf: spousePtchasSharedPolicyAllocation == true
    fields:
      - { name: sharedPolicyNumber, type: string, label: "Policy number (Form 1095-A line 2)" }
      - { name: sharedOtherTaxpayerSsn, type: ssn, label: "Other taxpayer's SSN", note: "digits only" }
      - { name: sharedAllocationStartMonth, type: month, label: "Start month" }
      - { name: sharedAllocationStopMonth, type: month, label: "Stop month" }
      - { name: sharedPremiumAllocationPct, type: percent, label: "Premium on this return", note: "saved as a fraction" }
      - { name: sharedSlcspAllocationPct, type: percent, label: "Benchmark (SLCSP) premium on this return" }
      - { name: sharedAptcAllocationPct, type: percent, label: "Advance payments on this return" }
      - { name: substituteMonthlySlcspAmount, type: amount, showIf: "married filing separately", label: "Benchmark premium for your own coverage family, monthly (Allocation Situation 2)" }
