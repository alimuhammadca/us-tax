# Form 8962 (2025) - Premium tax credit (Family Head). Component: form-premium-tax-credit.component.ts. Screen review 2026-11-09:
# removed with their columns (V453, owner 2026-11-09) - the "uploaded every Form 1095-A" confirmation (+ receivedAny1095A,
# uploadedAll1095AStatements), the unemployment and job-based offer questions (no effect in 2025), the typed Form 2555 add-backs (the
# figured lines 45 and 50 are used) and the typed Part V monthly contributions (Pub. 974 Worksheets I / III are figured). The noncitizen
# answer now decides the below-100% rule; a blank region comes from the address. The Forms 1095-A are statements.
name: premium-tax-credit-taxpayer
title: Premium tax credit (Form 8962)
multiplicity: single
formName: Form 8962
category: credits
sections:
  - name: coverage
    title: Marketplace coverage
    multiplicity: single
    fields:
      - { name: claimsOrReceivedPtc, type: boolean, required: true, label: "Was anyone in your tax family enrolled in a health plan through the Marketplace in 2025?" }
  - name: household
    title: Tax family
    multiplicity: single
    showIf: claimsOrReceivedPtc == true
    fields:
      - { name: taxFamilySize, type: integer, required: false, label: "Tax family size (line 1)", note: "blank: figured from the return" }
      - { name: fplRegion, type: select, options: [continental, alaska, hawaii], required: false, label: "Poverty table (line 4)", note: "blank: from the address" }
      - { name: mfsException, type: boolean, required: false, showIf: "married filing separately", label: "Domestic abuse / spousal abandonment exception (line A)" }
      - { name: noncitizenMarketplaceCoverage, type: boolean, required: false, label: "Anyone enrolled lawfully present and not eligible for Medicaid because of immigration status?" }
  - name: months
    title: Months with no credit
    multiplicity: single
    showIf: claimsOrReceivedPtc == true
    fields:
      - { name: ineligibleCoverageMonths, type: months, required: false, label: "Months when everyone on the plan could get other coverage or had affordable job-based coverage" }
      - { name: qsehraAffordable, type: boolean, required: false, showIf: "a Form W-2 shows box 12 code FF", label: "Is the QSEHRA affordable (Pub. 974 Worksheet N)?" }
      - { name: qsehraMonths, type: months, required: false, showIf: "a Form W-2 shows box 12 code FF", label: "Months the QSEHRA was provided" }
  - name: shared
    title: Policy shared with another return (Part IV)
    multiplicity: single
    showIf: claimsOrReceivedPtc == true
    fields:
      - { name: hasSharedPolicyAllocation, type: boolean, required: false, label: "Did a policy cover someone on another tax return, or someone on this return through another family's policy?" }
  - name: sharedPolicyAllocation
    title: Allocation
    multiplicity: multiple
    max: 4
    showIf: hasSharedPolicyAllocation == true
    fields:
      - { name: sharedPolicyNumber, type: string, label: "Policy number (Form 1095-A line 2)" }
      - { name: sharedOtherTaxpayerSsn, type: ssn, label: "Other taxpayer's SSN", note: "digits only" }
      - { name: sharedAllocationStartMonth, type: month, label: "Start month" }
      - { name: sharedAllocationStopMonth, type: month, label: "Stop month" }
      - { name: sharedPremiumAllocationPct, type: percent, label: "Premium on this return", note: "saved as a fraction" }
      - { name: sharedSlcspAllocationPct, type: percent, label: "Benchmark (SLCSP) premium on this return" }
      - { name: sharedAptcAllocationPct, type: percent, label: "Advance payments on this return" }
      - { name: substituteMonthlySlcspAmount, type: amount, showIf: "married filing separately", label: "Benchmark premium for your own coverage family, monthly (Allocation Situation 2)" }
  - name: dependentMagiEntries
    title: Dependents who must file a return (line 2b)
    multiplicity: multiple
    showIf: "claimsOrReceivedPtc == true and the return has dependents"
    fields:
      - { name: dependentName, type: select, label: "Dependent", note: "picked from the return's dependents" }
      - { name: dependentModifiedAgi, type: amount, label: "Modified AGI" }
  - name: marriage
    title: Married in 2025 (Part V)
    multiplicity: single
    showIf: "claimsOrReceivedPtc == true and married (joint or separate)"
    fields:
      - { name: useAlternativeCalculationForYearOfMarriage, type: boolean, required: false, label: "Were you both unmarried on January 1 and married on December 31, 2025, with advance payments before the wedding?" }
      - { name: marriageMonth, type: month, required: false, showIf: useAlternativeCalculationForYearOfMarriage == true, label: "Month you married" }
      - { name: altCalcFamilySizeTaxpayer, type: integer, required: false, showIf: useAlternativeCalculationForYearOfMarriage == true, label: "Your family before the marriage" }
      - { name: altCalcFamilySizeSpouse, type: integer, required: false, showIf: useAlternativeCalculationForYearOfMarriage == true, label: "Your spouse's family before the marriage" }
importedStatementFields:
  - { name: form1095A, source: "1095-a statements", readOnly: true, note: "listed on the screen with links" }
