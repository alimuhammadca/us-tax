# Business casualties and thefts (Form 4684 Section B), spouse. One entry per damaged, destroyed or stolen property; entries with the
# same casualty description are one Part I. The engine figures Parts I-II and reports the result on Form 4797 or Schedule A
# (form-4684-section-b-plan.md, owner-approved 2026-10-23).
name: business-casualties-spouse
title: Business casualties and thefts (Form 4684 Section B, spouse)
multiplicity: single
formName: Form 4684
category: income
instructions:
  - Enter each piece of business, rental or investment property damaged, destroyed or stolen in 2025.
sections:
  - name: screening
    title: Screening
    multiplicity: single
    fields:
      - name: hasBusinessCasualty
        type: boolean
        required: true
        label: Did business, rental or investment property of your spouse's get damaged, destroyed or stolen in 2025?

  - name: property
    title: Property
    multiplicity: multiple
    showIf: hasBusinessCasualty == true
    fields:
      - name: casualtyDescription
        type: text
        required: false
        label: "Which casualty or theft (line 29/34 (a); groups Part I)"
      - name: casualtyDate
        type: date
        required: false
        label: "Date of the casualty, or the date the theft was discovered (must be in 2025)"
      - name: propertyDescription
        type: text
        required: false
        label: "The property and where it was (line 19)"
      - name: propertyType
        type: select
        required: false
        label: "What kind of property"
        options:
          - "building"
          - "equipment"
          - "land"
          - "investment"
      - name: usedIn
        type: select
        required: false
        label: "Used in (column (b)(i) vs (b)(ii); employee = not deductible)"
        options:
          - "schedule_c"
          - "schedule_f"
          - "rental"
          - "investment"
          - "employee"
      # 1A-46 (V578, 2026-11-27): Form 8960 line 5b (Instructions for Form 8960; §1.1411-4(d)(4), (g)(7)).
      - name: niitBusinessUse
        type: choice
        required: false
        options: [no, active_business, safe_harbor_rental]
        label: "Was it used in a business you actively ran (a business or farm you materially participated in, or a rental meeting the real estate professional 500-hour safe harbor)?"
      - name: usedPersonallyAsHome
        type: boolean
        required: false
        label: "Is this building a home that you or your family also used personally in 2025? (V536; section 280A(c)(5))"
        showIf: "propertyType === 'building' && (usedIn === 'rental' || usedIn === 'schedule_f')"
      - name: section280aDeductibleLoss
        type: amount
        required: false
        label: "Deductible loss under section 280A(c)(5) - Form 4684 line 27 for this property (not more than the full loss)"
        showIf: "propertyType === 'building' && (usedIn === 'rental' || usedIn === 'schedule_f') && usedPersonallyAsHome === true"
      - name: recurringCasualtyInActivity
        type: boolean
        required: false
        label: "Do casualties or thefts like this one, similar in cause and severity, happen regularly in this business or rental? (V537; Yes blocks - not figured)"
        showIf: "usedIn === 'schedule_c' || usedIn === 'schedule_f' || usedIn === 'rental'"
      - name: usedPartlyPersonally
        type: boolean
        required: false
        label: "Was this property also used personally? (V538: enter the whole property's figures; Section B takes the business part)"
        showIf: "usedIn !== 'employee'"
      - name: businessUsePercent
        type: percent
        required: false
        label: "Business-use percentage (more than 0, up to 100)"
        showIf: "usedPartlyPersonally === true"
      - name: postponeGainSection1033
        type: boolean
        required: false
        label: "The reimbursement is more than the basis - a gain. Postpone it by buying replacement property (section 1033)? (V539)"
        showIf: "reimbursement received > (business) adjusted basis"
      - name: replacementPropertyCost
        type: amount
        required: false
        label: "Cost of the replacement property - blank if not bought yet (the whole gain is postponed)"
        showIf: "postponeGainSection1033 === true"
      - name: dateAcquired
        type: date
        required: false
        label: "Date acquired (line 19; held a year or less vs more)"
      - name: adjustedBasis
        type: amount
        required: false
        label: "Adjusted basis (line 20)"
      - name: depreciationAllowed
        type: amount
        required: false
        label: "Depreciation allowed or allowable (recapture on a gain)"
        showIf: "propertyType == building || propertyType == equipment"
      - name: reimbursement
        type: amount
        required: false
        label: "Insurance or other reimbursement, received or expected (line 21)"
      - name: totallyDestroyedOrStolen
        type: boolean
        required: false
        label: "Totally destroyed or stolen (line 26 = line 20)"
      - name: fmvBefore
        type: amount
        required: false
        label: "Fair market value just before (line 23)"
        showIf: "totallyDestroyedOrStolen == false"
      - name: fmvAfter
        type: amount
        required: false
        label: "Fair market value just after (line 24)"
        showIf: "totallyDestroyedOrStolen == false"
