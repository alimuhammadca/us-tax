# Schedule C sole-proprietor business income (taxpayer/family head).
# Self-employment Phase SE-1 (Stage 1 capture). One entry per business; each business
# nests per-vehicle (Part IV) and per-other-expense (Part V) repeatable rows.
# Computed: net profit -> Schedule 1 line 3, Schedule SE. 2026-11-06 screen review: lines I / J, 34, 43, 45, 46, 47a / 47b are shown;
# the person's own Forms 1099-NEC / 1099-K / 1099-MISC 5-6-11 / 1099-B bartering fill blank gross receipts (one business; box 11 added 2026-11-22).
name: business-income-taxpayer
title: Business income (Schedule C, taxpayer/family head)
multiplicity: single
formName: Schedule C
category: income
instructions:
  - Report income and expenses from a sole-proprietor business or profession (Schedule C).
  - Add one entry per business. Amounts from Forms 1099-NEC, 1099-K, and 1099-MISC can be imported and reconciled against gross receipts.
  - This form captures your data; the net profit, self-employment tax, and QBI are computed later and carried to Schedule 1 line 3 and Schedule 2.
sections:
  - name: screening
    title: Screening
    multiplicity: single
    fields:
      - name: hasBusinessIncome
        type: boolean
        required: true
        label: Did you operate a sole-proprietor business or profession in 2025?
        help: Select Yes if you had self-employment income reported on Schedule C (freelance, gig, consulting, a shop, etc.).

  - name: business
    title: Business
    multiplicity: multiple
    showIf: hasBusinessIncome == true
    instructions:
      - Complete one business per Schedule C. Vehicle and other-expense line items repeat within a business.
    fields:
      # Part I header / profile (lines A-J)
      - name: principalBusinessOrProfession
        type: text
        required: true
        label: Principal business or profession (line A)
        help: e.g. Consulting, Software development, Rideshare driver.
      - name: principalBusinessCode
        type: text
        required: true
        label: Business code (line B)
        help: The 6-digit NAICS code from the Schedule C instructions that best fits your activity.
      - name: commercialFishingBusiness
        type: boolean
        required: false
        label: Is this a commercial fishing business? (catching or harvesting fish, shellfish or other aquatic life)
        help: B121 (V369) - its Schedule C line 7 is gross income from fishing for the Form 2210-F two-thirds test (Pub. 505).
          Business code 114110 (Fishing) counts as Yes unless answered No.
      - name: businessName
        type: text
        required: false
        label: Business name (line C)
        help: Leave blank if the business has no separate name.
      - name: businessEin
        type: text
        required: false
        label: Employer ID number (EIN, line D)
        help: Enter only if the business has its own EIN. Format NN-NNNNNNN.
      - name: businessAddressStreet
        type: text
        required: false
        label: Business address (line E)
      - name: businessAddressCityStateZip
        type: text
        required: false
        label: City, state, ZIP (line E)
      - name: accountingMethod
        type: select
        required: true
        label: Accounting method (line F)
        options:
          - cash
          - accrual
          - other
      - name: accountingMethodOtherSpecify
        type: text
        required: false
        label: Other accounting method (specify)
        help: Shown only when accounting method is Other.
      - name: materiallyParticipated
        type: boolean
        required: true
        label: Did you materially participate in this business in 2025? (line G)
        help: Material participation makes the profit or loss nonpassive (fully deductible).
      - name: communityPct
        type: percent
        required: false
        showIf: filing-status filingStatus = Married filing separately and communityPropertyState = true
        label: Community share of this business (%) - blank = all community property
        help: B118 (V366) - Pub. 555 / Form 8958 line 5. The community part of the business's net profit is split evenly between the two separate returns for income tax; self-employment tax stays with the spouse who carries it on. 0 = separate property.
      - name: startedOrAcquiredThisYear
        type: boolean
        required: false
        label: Did you start or acquire this business during 2025? (line H)
      - name: requiredToFile1099s
        type: boolean
        required: false
        label: Did you make payments in 2025 that required filing Form(s) 1099? (line I)
      - name: filed1099s
        type: boolean
        required: false
        label: If Yes, did you or will you file the required Form(s) 1099? (line J)
        help: Shown only when line I is Yes.
      - name: statutoryEmployeeW2Link
        type: boolean
        required: false
        label: This income was reported on a W-2 with the "statutory employee" box checked
        help: If checked, expenses are allowed but no self-employment tax applies.

      # Part I income (lines 1, 2, 6)
      - name: grossReceiptsOrSales
        type: amount
        required: false
        placeholder: 0.00
        label: Gross receipts or sales (line 1)
        help: Total business income before expenses. Imported 1099-NEC/1099-K/1099-MISC amounts can pre-fill this.
      - name: form1099NecExplanation   # V581 (owner-approved 2026-11-26, parked item 8)
        type: text
        required: false
        label: Your Forms 1099-NEC show more than the gross receipts - explain the difference (line 1 statement)
        showIf: "Forms 1099-NEC box 1 total > gross receipts of all this person's businesses"
        help: 2025 Schedule C instructions, line 1 - attach a statement explaining the difference. The return lists the text as the statement to attach.
      - name: returnsAndAllowances
        type: amount
        required: false
        placeholder: 0.00
        label: Returns and allowances (line 2)
      - name: otherIncome
        type: amount
        required: false
        placeholder: 0.00
        label: Other income, including fuel tax credit or refund (line 6)
      - name: accountingMethodChanged   # V581
        type: boolean
        required: false
        label: Did this business change its accounting method (Form 3115)?
      - name: section481aAdjustment   # V581
        type: amount
        signed: true
        required: false
        label: Section 481(a) adjustment taken into account in 2025 (negative if it lowers income)
        showIf: "accountingMethodChanged == true"
        help: Positive -> line 6 other income; negative -> Part V other expense "Section 481(a) adjustment (Form 3115)".

      # Part III cost of goods sold (lines 33-41)
      - name: inventoryMethod
        type: select
        required: false
        label: Inventory valuation method (line 33)
        options:
          - cost
          - lower_of_cost_or_market
          - other
      - name: inventoryMethodChanged
        type: boolean
        required: false
        label: Was there a change in determining quantities, costs, or valuations? (line 34)
      - name: inventoryAtBeginningOfYear
        type: amount
        required: false
        placeholder: 0.00
        label: Inventory at beginning of year (line 35)
      - name: purchasesLessPersonalUse
        type: amount
        required: false
        placeholder: 0.00
        label: Purchases less cost of items withdrawn for personal use (line 36)

      - name: purchasesWithdrawnForPersonalUse
        type: amount
        required: false
        label: Cost of merchandise you took for personal or family use
        help: Line 36 is purchases less personal withdrawals and less returns - these are subtracted.

      - name: purchaseReturnsAndAllowances
        type: amount
        required: false
        label: Purchase returns and allowances
      - name: costOfLabor
        type: amount
        required: false
        placeholder: 0.00
        label: Cost of labor (line 37)

      - name: costOfLaborW2Wages
        type: amount
        required: false
        label: "Of the cost of labor, the part paid as W-2 wages (QBI wage limit)"
      - name: materialsAndSupplies
        type: amount
        required: false
        placeholder: 0.00
        label: Materials and supplies (line 38)
      - name: otherCosts
        type: amount
        required: false
        placeholder: 0.00
        label: Other costs (line 39)
      - name: inventoryAtEndOfYear
        type: amount
        required: false
        placeholder: 0.00
        label: Inventory at end of year (line 41)

      # Part II expenses (lines 8-27a)
      - name: advertising
        type: amount
        required: false
        placeholder: 0.00
        label: Advertising (line 8)
      - name: carAndTruckExpenses
        type: amount
        required: false
        placeholder: 0.00
        label: Car and truck expenses (line 9)
        help: If claimed, complete the Vehicle section below.
      - name: commissionsAndFees
        type: amount
        required: false
        placeholder: 0.00
        label: Commissions and fees (line 10)
      - name: contractLabor
        type: amount
        required: false
        placeholder: 0.00
        label: Contract labor (line 11)
      - name: depletion
        type: amount
        required: false
        placeholder: 0.00
        label: Depletion (line 12)
      - name: depreciation
        type: amount
        required: false
        placeholder: 0.00
        label: Depreciation and section 179 (line 13)
        help: Computed from the depreciation-asset form in a later phase; enter a known amount for now.
      - name: employeeBenefitPrograms
        type: amount
        required: false
        placeholder: 0.00
        label: Employee benefit programs (line 14)
      - name: insuranceOtherThanHealth
        type: amount
        required: false
        placeholder: 0.00
        label: Insurance other than health (line 15)
      - name: interestMortgage
        type: amount
        required: false
        placeholder: 0.00
        label: Interest - mortgage (line 16a)
      - name: interestOther
        type: amount
        required: false
        placeholder: 0.00
        label: Interest - other (line 16b)
      - name: legalAndProfessionalServices
        type: amount
        required: false
        placeholder: 0.00
        label: Legal and professional services (line 17)
      - name: officeExpense
        type: amount
        required: false
        placeholder: 0.00
        label: Office expense (line 18)
      - name: pensionAndProfitSharingPlans
        type: amount
        required: false
        placeholder: 0.00
        label: Pension and profit-sharing plans (line 19)
      - name: rentVehiclesMachineryEquipment
        type: amount
        required: false
        placeholder: 0.00
        label: Rent - vehicles, machinery, equipment (line 20a)
      - name: rentOtherBusinessProperty
        type: amount
        required: false
        placeholder: 0.00
        label: Rent - other business property (line 20b)
      - name: repairsAndMaintenance
        type: amount
        required: false
        placeholder: 0.00
        label: Repairs and maintenance (line 21)
      - name: supplies
        type: amount
        required: false
        placeholder: 0.00
        label: Supplies (line 22)
      - name: taxesAndLicenses
        type: amount
        required: false
        placeholder: 0.00
        label: Taxes and licenses (line 23)
      - name: travel
        type: amount
        required: false
        placeholder: 0.00
        label: Travel (line 24a)
      - name: meals
        type: amount
        required: false
        placeholder: 0.00
        label: Business meals - the full cost (the return applies the 50% / 80% limit for line 24b)
        help: Enter the full meal cost; the 50% limit is applied when the return is computed.
      - name: fullyDeductibleMeals   # V581
        type: amount
        required: false
        label: Of those meals, the part that is 100% deductible
        showIf: "meals > 0"
        help: Meals treated as wages to an employee, or reported in a nonemployee's income on Form 1099-NEC - deducted in full; the rest at 50% / 80%.
      - name: utilities
        type: amount
        required: false
        placeholder: 0.00
        label: Utilities (line 25)
      - name: wages
        type: amount
        required: false
        placeholder: 0.00
        label: Wages, less employment credits (line 26)

      - name: wagesNotOnW2
        type: amount
        required: false
        label: "Of the line 26 wages, the part not reported on Forms W-2 (QBI wage limit)"
      - name: energyEfficientCommercialBldgsDeduction
        type: amount
        required: false
        placeholder: 0.00
        label: Energy efficient commercial buildings deduction (line 27b / Form 7205)

      # Line 30 home office
      - name: homeOfficeMethod
        type: select
        required: false
        label: Home office deduction method (line 30)
        options:
          - none
          - simplified
          - form8829
      - name: homeOfficeTotalSqft
        type: number
        required: false
        label: Total square footage of your home
        help: Simplified method only.
      - name: homeOfficeBusinessSqft
        type: number
        required: false
        label: Square footage used for business (max 300)
        help: Simplified method only; deduction is $5 per square foot up to 300.

      # Part IV shared vehicle questions (lines 46-47)
      - name: fiveOrMoreVehiclesAtOnce   # V581
        type: boolean
        required: false
        label: Do you use five or more vehicles in this business at the same time?
        showIf: "vehicles.length > 0"
        help: Line 9 - Yes rules out the standard mileage rate (a blocking flag asks for actual car and truck expenses).
      - name: anotherVehicleAvailablePersonalUse
        type: boolean
        required: false
        label: Do you (or your spouse) have another vehicle available for personal use? (line 46)
      - name: evidenceToSupportDeduction
        type: boolean
        required: false
        label: Do you have evidence to support the vehicle deduction? (line 47a)
      - name: evidenceIsWritten
        type: boolean
        required: false
        label: If Yes, is the evidence written? (line 47b)

      # Gates
      - name: operatedForProfit
        type: boolean
        required: true
        label: Is this activity carried on with the intent to make a profit?
        help: If No, it is a hobby; income is reported on Schedule 1 line 8j and no self-employment tax applies.
      - name: hobbySupportingDocs
        type: text
        required: false
        label: If a hobby, briefly describe the activity
        retired: true  # owner 2026-11-06: read by nothing; no longer asked, column kept and saved blank
      - name: allInvestmentAtRisk
        type: boolean
        required: false
        label: Is all of your investment in this business at risk? (lines 32a / 32b, one Yes / No question since 2026-11-06)
        help: Answer only if the business had a loss.
      - name: someInvestmentNotAtRisk
        type: boolean
        required: false
        label: Some investment is not at risk (line 32b, requires Form 6198)
        computed: true  # saved as the opposite of allInvestmentAtRisk (owner 2026-11-06)
        help: Answer only if the business had a loss.
      - name: priorYearAtRiskCarryforward
        type: amount
        required: false
        label: Prior-year suspended at-risk loss for this business (Form 6198)
        help: First year filing with us — the §465 disallowed loss carried into this business from last year, released against this year's amount at risk.
      - name: priorYearUnallowedPassiveLoss   # V581
        type: amount
        required: false
        label: Passive loss from this business not allowed in 2024 (Form 8582)
        showIf: "materiallyParticipated == false"
        help: Line 31 - joins this year's passive losses; what passive income doesn't absorb carries to 2026.
      - name: deMinimisSafeHarbor   # V581
        type: boolean
        required: false
        label: Write off items costing $2,500 or less at once instead of depreciating them (de minimis safe harbor)?
        help: Part V - the 2025 items on Depreciable assets at or under the limit (not buildings or land) are deducted as "De minimis safe harbor (Reg. 1.263(a)-1(f))" and not depreciated.
      - name: deMinimisApplicableFinancialStatement   # V581
        type: boolean
        required: false
        label: Does the business have an applicable financial statement (audited, or filed with the SEC) - a $5,000 limit?
        showIf: "deMinimisSafeHarbor == true"
      - name: isSpecifiedServiceTradeOrBusiness
        type: boolean
        required: false
        label: Is this a specified service trade or business (SSTB)? (for the QBI deduction)
        help: SSTB includes health, law, accounting, consulting, financial/brokerage services, performing arts, athletics, and any trade whose principal asset is the reputation or skill of its owners. Above the QBI income threshold, an SSTB's deduction phases out.

  - name: vehicles
    title: Vehicle information (Part IV)
    multiplicity: multiple
    showIf: hasBusinessIncome == true
    instructions:
      - Add one row per vehicle used in the business. Required when car and truck expenses are claimed.
    fields:
      - name: description
        type: text
        required: false
        label: Vehicle description
      - name: inServiceMonth
        type: number
        required: false
        label: Month placed in service
      - name: inServiceDay
        type: number
        required: false
        label: Day placed in service
      - name: inServiceYear
        type: number
        required: false
        label: Year placed in service
      - name: businessMiles
        type: number
        required: false
        label: Business miles (line 44a)
      - name: commutingMiles
        type: number
        required: false
        label: Commuting miles (line 44b)
      - name: otherMiles
        type: number
        required: false
        label: Other miles (line 44c)
      - name: availableForPersonalUse
        type: boolean
        required: false
        label: Was the vehicle available for personal use during off-duty hours? (line 45)
      - name: parkingFees
        type: number
        required: false
        label: Parking fees
        help: Business parking fees — deductible on top of the standard mileage rate.
      - name: tolls
        type: number
        required: false
        label: Tolls
        help: Business tolls — deductible on top of the standard mileage rate.

      - name: carLoanInterest
        type: amount
        required: false
        label: Car loan interest paid (full amount - we take the business share)

      - name: vin
        type: text
        required: false
        label: Vehicle identification number (VIN)
        showIf: "carLoanInterest > 0"
        help: "Needed if this car's loan interest is also claimed under 'No tax on car loan interest' (Schedule 1-A)."

      - name: leased   # V581: line 9 - asked only with the standard mileage rate (car and truck expenses blank, business miles)
        type: boolean
        required: false
        label: Is this vehicle leased?
      - name: standardRateEntireLease   # V581
        type: boolean
        required: false
        label: Has the standard mileage rate been used for this vehicle since the lease began?
        showIf: "leased == true"
      - name: usedStandardRateFirstYear   # V581
        type: boolean
        required: false
        label: Was the standard mileage rate used in the first year this vehicle was used in the business?
        showIf: "leased != true and placed in service before 2025"
        help: Pub. 463 ch. 4 - the rate must be chosen in an owned car's first year; No (or a leased car without the rate for the whole lease) blocks the rate.

  - name: otherExpenses
    title: Other expenses (Part V)
    multiplicity: multiple
    showIf: hasBusinessIncome == true
    instructions:
      - List other expenses not covered by lines 8-27a. The total flows to line 27a.
    fields:
      - name: description
        type: text
        required: false
        label: Description
      - name: amount
        type: amount
        required: false
        placeholder: 0.00
        label: Amount

  - name: importedStatementFields
    title: Imported statement amounts
    multiplicity: single
    readOnly: true
    instructions:
      - Backend-only. Gross receipts pre-fill candidates imported from statements; not rendered directly.
    fields:
      - name: imported1099NecBox1
        type: amount
        readOnly: true
        label: 1099-NEC box 1 (nonemployee compensation)
      - name: imported1099KBox1a
        type: amount
        readOnly: true
        label: 1099-K box 1a (payment card / third-party network)
      - name: imported1099MiscBusinessBoxes
        type: amount
        readOnly: true
        label: 1099-MISC business boxes (3/5/6/11/etc.)

  - name: computedOutputs
    title: Computed outputs
    multiplicity: single
    readOnly: true
    computed: true
    instructions:
      - Backend-only computed results (Stage 2). Not rendered by the UI.
    fields:
      - name: netProfitOrLoss
        type: amount
        readOnly: true
        computed: true
        label: Schedule C line 31 net profit or loss (to Schedule 1 line 3)
