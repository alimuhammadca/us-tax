# Business property sales (Form 4797), spouse. One entry per sale; each becomes a Form 4797 Part III property and the engine
# figures the recapture, section 1231 gain or loss and unrecaptured section 1250 gain (form-4797-sales-plan.md, owner-approved 2026-10-23).
name: business-property-sales-spouse
title: Business property sales (Form 4797, spouse)
multiplicity: single
formName: Form 4797
category: income
instructions:
  - Enter each piece of business or rental property sold, exchanged or otherwise disposed of in 2025.
sections:
  - name: screening
    title: Screening
    multiplicity: single
    fields:
      - name: hasBusinessPropertySale
        type: boolean
        required: true
        label: Did your spouse sell, exchange or otherwise dispose of business or rental property in 2025?

  - name: sale
    title: Sale
    multiplicity: multiple
    showIf: hasBusinessPropertySale == true
    fields:
      - name: description
        type: text
        required: false
        label: "Describe the property"
      - name: propertyType
        type: select
        required: false
        label: "What kind of property?"
        options:
          - "building"
          - "equipment"
          - "land"
          - "mineral_1254"   # V545: oil, gas, geothermal or other mineral property (section 1254, Form 4797 line 28)
          - "timber"         # V547: standing timber (section 631) - depletion not recaptured; reforestation amortization is
          - "unharvested_crop"   # 2026-11-19: a growing crop sold with the farmland (section 1231(b)(4)) - takes the land's dates; costOrBasis = growing costs (section 268)
      - name: usedFor
        type: select
        required: false
        label: "Used in"
        options:
          - "schedule_c"
          - "schedule_f"
          - "rental"
          - "other"
      - name: soldToRelated1239
        type: boolean
        required: false
        label: "Sold to a related company, trust or estate that will depreciate it? (V546, section 1239 - the whole gain is ordinary, Form 4797 line 10)"
        showIf: "propertyType in [building, equipment, cattle_horses, livestock_other, cost_sharing_1255]"
      - name: inherited
        type: boolean
        required: false
        label: "Inherited? (long-term whatever the dates)"
      - name: dateAcquired
        type: date
        required: false
        label: "Date acquired"
        showIf: "inherited != true"
      - name: dateSold
        type: date
        required: false
        label: "Date sold or disposed of"
      - name: grossSalesPrice
        type: amount
        required: false
        label: "Gross sales price (Form 1099-S box 2)"
      - name: sellingExpenses
        type: amount
        required: false
        label: "Commissions and other expenses of sale"
      - name: costOrBasis
        type: amount
        required: false
        label: "Cost or other basis, including improvements"
      - name: depreciationAllowed
        type: amount
        required: false
        label: "Depreciation allowed or allowable, incl. section 179 and bonus"
        showIf: "propertyType != land"
      - name: additionalDepreciation1250
        type: amount
        required: false
        label: "Depreciation above straight-line (optional)"
        showIf: "propertyType == building"
      - name: amtDepreciation
        type: amount
        required: false
        label: "AMT depreciation, if different (optional)"
        showIf: "propertyType != land"
      - name: reforestationAmortization
        type: amount
        required: false
        label: "Reforestation costs amortized (section 194) - timber only (V547, section 1245 recapture on Form 4797 line 25)"
        showIf: "propertyType == timber"
      - name: section1254RecaptureAmount
        type: amount
        required: false
        label: "Drilling, exploration, development and depletion deductions to recapture (V545, Form 4797 line 28a)"
        showIf: "propertyType == mineral_1254"
      - name: condemned
        type: boolean
        required: false
        label: "Was it condemned - taken by a government or other authority for public use (or sold under threat of that)? (V548, section 1033)"
      - name: postponeGainSection1033
        type: boolean
        required: false
        label: "Do you choose to postpone the gain by buying replacement property similar or related in use? (V548, section 1033(a)(2))"
        showIf: "condemned == true"
      - name: replacementPropertyCost
        type: amount
        required: false
        label: "Cost of the replacement property - blank if not bought yet (V548; gain recognized = min(gain, award - cost), recapture limited to it)"
        showIf: "condemned == true && postponeGainSection1033 == true"
# 2026-11-06 screen review: atRiskActivity is saved as "rental:<address>" / "farm:<crop>" / "business:<name>" (old "rental:0" positions still read).
