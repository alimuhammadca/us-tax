formId: child-interest-dividends
title: "Child's int. & dividends (Form 8814)"
description: >
  The parents' election to report a child's interest and dividends on their return (Form 8814), asked on the child's own dependent tab.
  One entry per child; the entry IS the election (Yes keeps it, No removes it). Screen review 2026-11-07 (owner): the child's name and
  SSN come from the dependent record (no longer typed); the amounts come from the child's Forms 1099-INT / 1099-DIV (and 1099-OID,
  Schedule K-1) in the calculation, and a typed amount replaces a line (an old copied-in amount equal to the statement total is dropped
  on load); one estimated-payments question (childHadPriorYearOverpaymentApplied folded in, saved blank); backup withholding from the
  statements' box 4 (childHadBackupWithholding saved blank); the Alaska Permanent Fund dividends are added to line 2a. Help in
  data/child-interest-dividends-help.ts.
type: statement-entries

sections:
  - name: election
    title: "Form 8814 election"
    fields:
      - name: elects
        type: boolean
        label: "Do you elect to report the child's interest and dividends on your return for 2025?"
        note: "Not a saved key - an entry exists for the child."
      - name: childFirstName
        type: text
        readOnly: true
        source: "the dependent record"
      - name: childLastName
        type: text
        readOnly: true
        source: "the dependent record"
      - name: childSsn
        type: ssn
        readOnly: true
        source: "the dependent record (digits only)"

  - name: amounts
    title: "The child's interest and dividends"
    description: "Blank = the child's statements; a typed amount replaces that line."
    fields:
      - { name: line1aTaxableInterest, type: amount, label: "Taxable interest (line 1a)" }
      - { name: line1bTaxExemptInterest, type: amount, label: "Tax-exempt interest (line 1b)" }
      - { name: childPrivateActivityBondInterest, type: amount, label: "Of it, private activity bond interest" }
      - { name: line2aOrdinaryDividends, type: amount, label: "Ordinary dividends (line 2a)" }
      - { name: line2bQualifiedDividends, type: amount, label: "Of them, qualified dividends (line 2b)" }
      - { name: line3CapGainDistributions, type: amount, label: "Capital gain distributions (line 3)" }

  - name: eligibility
    title: "Eligibility"
    fields:
      - { name: childFiledJointReturnForTaxYear, type: boolean, label: "Does the child file a joint return for 2025?" }
      - { name: childHadEstimatedTaxPayments, type: boolean, label: "Were any estimated tax payments made for the child for 2025, including a 2024 refund applied to them?" }

  - name: parent
    title: "Which parent can elect"
    showIf: "the parents don't file jointly"
    fields:
      - { name: parentIsCustodialParent, type: boolean, label: "Did the child live with you for most of 2025 (you are the custodial parent)?" }
      - { name: otherParentHasHigherTaxableIncome, type: boolean, label: "Only if you file separately from your spouse, or you and the child's other parent never married and lived together all year: does the other parent have the higher taxable income?" }

  - name: other
    title: "Less common amounts"
    fields:
      - { name: childNomineeAdjustmentLine1a, type: amount, label: "Interest received as a nominee" }
      - { name: childNomineeAdjustmentLine2a, type: amount, label: "Ordinary dividends received as a nominee" }
      - { name: childNomineeAdjustmentLine3, type: amount, label: "Capital gain distributions received as a nominee" }
      - { name: childAlaskaPermanentFundDividendsPortion, type: amount, label: "Alaska Permanent Fund dividends (Form 1099-MISC box 3)", note: "added to line 2a unless a line 2a amount is typed" }
