formId: ctc-actc-screening-taxpayer   # also ctc-actc-screening-spouse (same bare keys; her own on a separate return)
title: Child Tax Credit settings
description: >
  The child tax credit, the credit for other dependents and the additional child tax credit are figured on Schedule 8812 from
  Dependents and the return. The screen asks the few questions the return can't answer. Screen review 2026-11-10 (owner, V464):
  the Puerto Rico question is removed (worked out from Income earned in a US territory); on a joint return the questions are asked
  once, on the Family Head's copy - the spouse copy shows a note.

sections:
  - id: children
    title: Qualifying children and other dependents
    instructions:
      - Shown from Dependents (qualifiesForCTC / qualifiesForODC) with the last computed Form 1040 lines 19 and 28. No inputs.

  - id: denied
    title: Credit reduced or denied before
    fields:
      - id: ctcPreviouslyDenied
        label: Did the IRS reduce or deny your (or your spouse's) child tax credit, additional child tax credit or credit for other dependents for a year after 2015?
        type: boolean
      - id: ctcPriorDisallowanceReason
        label: Why was it reduced or denied?
        type: select
        options: [MATH_CLERICAL, RECKLESS_DISREGARD, FRAUD, OTHER]
        showIf: ctcPreviouslyDenied == true
      - id: ctcPriorDeterminationYear
        label: Year of the IRS final decision (2016 to the tax year)
        type: integer
        showIf: ctcPriorDisallowanceReason in [RECKLESS_DISREGARD, FRAUD]
      - id: ctcAllowedSinceForm8862
        label: Since then, was Form 8862 filed and the credit allowed?
        type: boolean
        showIf: ctcPreviouslyDenied == true

  - id: actc
    title: Additional child tax credit (line 28)
    fields:
      # Form 1040 line 28: "If you do not want to claim the additional child tax credit, check the box on line 28."
      - id: electsNoActc
        label: Leave the additional child tax credit off the return (check the box on line 28)?
        type: boolean

  - id: puertoRico
    title: Bona fide resident of Puerto Rico
    instructions:
      - Shown, not asked (V464) - from Income earned in a US territory (possession puerto_rico, bona fide resident all year; either
        spouse on a joint return). With it, Schedule 8812 Part II-B runs with any number of qualifying children.

  - id: computedOutputs
    readOnly: true
    computed: true
    fields:
      - id: isBonafidePuertoRicoResident
        label: Bona fide resident of Puerto Rico (CtcScreeningInputs, from possession-residence-exclusion-taxpayer / -spouse)
        type: boolean
