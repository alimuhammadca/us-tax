# Depreciable business assets (Form 4562) — taxpayer/family head.
# Per-asset multi-instance capture of the inputs the MACRS / section 179 / bonus engine needs.
# The depreciation computation is added in Stage 2.
name: depreciation-asset-taxpayer
title: Depreciable assets (Form 4562, taxpayer/family head)
multiplicity: single
formName: Form 4562
category: income
instructions:
  - Enter each business asset placed in service. The depreciation is computed and carried to the depreciation line of the related Schedule C, F, or E.
  - Add one entry per asset.
sections:
  - name: screening
    title: Screening
    multiplicity: single
    fields:
      - name: hasDepreciableAssets
        type: boolean
        required: true
        label: Do you have depreciable business assets?

  - name: asset
    title: Asset
    multiplicity: multiple
    showIf: hasDepreciableAssets == true
    fields:
      - name: description
        type: text
        required: false
        label: Description
      - name: activityType
        type: select
        required: false
        label: Used for
        options:
          - schedule_c
          - schedule_f
          - rental
          - other
      - name: activityDescription
        type: text
        required: false
        label: Which business/farm/property (name)
      - name: datePlacedInService
        type: text
        required: false
        placeholder: 2025-03-01
        label: Date placed in service (YYYY-MM-DD)
      - name: costBasis
        type: amount
        required: false
        placeholder: 0.00
        label: Cost or basis
      - name: businessUsePercent
        type: number
        required: false
        label: Business-use percentage
      - name: recoveryPeriodYears
        type: select
        required: false
        label: Recovery period (years)
        options:
          - '3'
          - '5'
          - '7'
          - '10'
          - '15'
          - '20'
          - '25'
          - '27.5'
          - '39'
      - name: depreciationMethod
        type: select
        required: false
        label: Depreciation method
        options:
          - 200db
          - 150db
          - sl
          - ads
      - name: convention
        type: select
        required: false
        label: Convention
        options:
          - half_year
          - mid_quarter
          - mid_month
      - name: section179Election
        type: amount
        required: false
        placeholder: 0.00
        label: Section 179 expense elected
      - name: bonusDepreciationElected
        type: boolean
        required: false
        label: Elect bonus depreciation
      - name: isListedProperty
        type: boolean
        required: false
        label: Listed property (vehicle, computer, etc.)
      - name: isPassengerAutomobile
        type: boolean
        required: false
        label: Passenger automobile (subject to the annual luxury-auto depreciation caps)
      - name: priorDepreciation
        type: amount
        required: false
        placeholder: 0.00
        label: Prior-year accumulated depreciation
      - name: earlierPartIvRecapture
        type: boolean
        required: false
        showIf: placed in service before 2025 and (isListedProperty == true or section179Election > 0)
        label: Was a Form 4797 Part IV recapture reported on this asset in an earlier year?
        helpText: >
          B114 (V364) - Form 4797 line 35, "increase your basis in the property by the recapture amount". Yes: a section 179
          asset is depreciated as if the 179 deduction had never been taken; listed property stays on ADS straight line. The
          bridge fills it from last year's asset rows (matching owner, description, activity, date placed in service, cost).
      - name: earlierPartIvRecaptureAmount
        type: amount
        required: false
        showIf: earlierPartIvRecapture == true
        label: Recapture amount (Form 4797 line 35)
      # B122 (V370): Form 4562 Part V line 24a / 24b (listed property) and Section B lines 30-36 (a vehicle). Blank -> the
      # answers on the Business income form (Schedule C Part IV vehicle row, lines 46 / 47a / 47b) are used.
      - name: listedEvidenceSupportsUse
        type: boolean
        required: false
        showIf: isListedProperty == true or isPassengerAutomobile == true or isHeavySuv == true
        label: Do you have evidence to support the business use claimed? (Form 4562 line 24a)
      - name: listedEvidenceWritten
        type: boolean
        required: false
        showIf: listedEvidenceSupportsUse == true
        label: Is the evidence written? (line 24b)
      - name: vehicleBusinessMiles
        type: integer
        required: false
        showIf: isListedProperty == true or isPassengerAutomobile == true or isHeavySuv == true
        label: Business miles driven in 2025 (do not include commuting) (line 30)
      - name: vehicleCommutingMiles
        type: integer
        required: false
        showIf: isListedProperty == true or isPassengerAutomobile == true or isHeavySuv == true
        label: Commuting miles (line 31)
      - name: vehicleOtherPersonalMiles
        type: integer
        required: false
        showIf: isListedProperty == true or isPassengerAutomobile == true or isHeavySuv == true
        label: Other personal (noncommuting) miles (line 32)
      - name: vehicleAvailableOffDuty
        type: boolean
        required: false
        showIf: isListedProperty == true or isPassengerAutomobile == true or isHeavySuv == true
        label: Was the vehicle available for personal use during off-duty hours? (line 34)
      - name: vehicleAnotherAvailable
        type: boolean
        required: false
        showIf: isListedProperty == true or isPassengerAutomobile == true or isHeavySuv == true
        label: Is another vehicle available for personal use? (line 36)

  # V403 (owner-approved, D-4562-15): saved as the amortizations list.
  - name: amortizations
    title: "Amortization (Form 4562 Part VI; asked whatever the asset answer)"
    multiplicity: multiple
    fields:
      - name: description
        type: text
        required: false
        label: "Description of costs"
      - name: dateAmortizationBegins
        type: date
        required: false
        label: "Date amortization begins (YYYY-MM-DD)"
      - name: amortizableAmount
        type: number
        required: false
        label: "Amortizable amount"
      - name: codeSection
        type: select
        required: false
        label: "Code section"
        options: ["195", "248", "197", "other"]
      - name: periodMonths
        type: number
        required: false
        label: "Amortization period (months)"
      - name: usedIn
        type: select
        required: false
        label: "Used for"
        options: ["schedule_c", "schedule_f", "rental", "other"]
      - name: usedInDescription
        type: text
        required: false
        label: "Which business/farm/property (name)"
      - name: priorYearsAmortization
        type: number
        required: false
        label: "Amortization taken in earlier years (not the first-year start-up deduction)"

  - name: computedOutputs
    title: Computed outputs
    multiplicity: single
    readOnly: true
    computed: true
    instructions:
      - Backend-only computed results (Stage 2). Not rendered by the UI.
    fields:
      - name: currentYearDepreciation
        type: amount
        readOnly: true
        computed: true
        label: Current-year depreciation (to the related schedule)
