# Form 1040 Dependents section - one record per dependent (/api/personal/dependents).
# Screen review 2026-11-10 (owner, V465): the child tax credit / credit for other dependents are worked out from the facts (Form 1040
# instructions, Who Qualifies as Your Dependent, Steps 1-5; UI utils/dependent-qualification.ts, compute DependentQualification) and
# saved as worked out; "more than half the year" from the months; the other-parent question removed.
name: identification-dependent
title: Dependent
multiplicity: single
category: personal

sections:
  - name: identity
    title: Name, number and relationship
    fields:
      - {name: dependentFirstName, type: text, required: true, label: First name}
      - {name: dependentMiddleInitial, type: text, label: Middle initial}
      - {name: dependentLastName, type: text, required: true, label: Last name}
      - {name: dependentSSN, type: ssn, required: true, label: Social security number (digits only; eye)}
      - {name: dependentDateOfBirth, type: date, label: Date of birth (eye)}
      - {name: relationship, type: select, required: true, label: Relationship to you,
         options: [Son, Daughter, Stepchild, Foster child, Brother, Sister, Half brother, Half sister, Stepbrother, Stepsister, Grandchild,
                   Niece, Nephew, Parent, Grandparent, Stepfather, Stepmother, Aunt, Uncle, Son-in-law, Daughter-in-law, Father-in-law,
                   Mother-in-law, Brother-in-law, Sister-in-law, Other household member]}
      - {name: citizenship, type: radio, label: "U.S. citizen, U.S. national or U.S. resident alien?", options: [us, canada_mexico, other]}

  - name: home
    title: Where the dependent lived
    fields:
      - {name: monthsLivedWithTaxpayer, type: integer, label: Months lived with you (0-12)}
      - {name: childLivedWithTaxpayerInUSA, type: boolean, label: In the United States for more than half the year (row 5b)}
      - {name: releasedByCustodialParent, type: boolean, label: "The other parent released the claim (Form 8332)",
         showIf: "monthsLivedWithTaxpayer < 7 and relationship is son / daughter / stepchild"}

  - name: child
    title: Qualifying child
    fields:
      - {name: isPermanentlyAndTotallyDisabled, type: boolean, label: Permanently and totally disabled (row 6)}
      - {name: isFullTimeStudent, type: boolean, label: Full-time student (row 6), showIf: "age 19-23 (or unknown) and not disabled"}
      - {name: providedOverHalfOwnSupport, type: boolean, label: Provided over half of own support, showIf: "a qualifying-child relationship"}

  - name: relative
    title: Qualifying relative
    showIf: "not a qualifying child"
    fields:
      - {name: youProvidedOverHalfSupport, type: boolean, label: You provided over half of the support}
      - {name: claimedUnderMultipleSupportAgreement, type: boolean, label: Multiple support agreement (Form 2120), showIf: "youProvidedOverHalfSupport == false"}
      - {name: grossIncome, type: amount, label: Gross income}

  - name: otherClaimant
    title: Another person who can claim the dependent
    fields:
      - {name: isQualifyingChildOfAnotherTaxpayer, type: boolean, label: Also the qualifying child of another person}
      - {name: otherClaimantIsParent, type: boolean, showIf: "isQualifyingChildOfAnotherTaxpayer"}
      - {name: otherParentClaimsChild, type: boolean, showIf: "otherClaimantIsParent"}
      - {name: otherClaimantAgi, type: amount, showIf: "isQualifyingChildOfAnotherTaxpayer"}

  - name: claimedBy
    title: Which return claims the dependent
    showIf: "separate returns (MFS, or married head of household)"
    fields:
      - {name: claimedByMfs, type: select, options: [taxpayer, spouse]}

  - name: computedOutputs
    readOnly: true
    computed: true
    fields:
      - {name: qualifiesForCTC, type: boolean, label: Child tax credit (row 7) - worked out; kept as saved until citizenship is answered}
      - {name: qualifiesForODC, type: boolean, label: Credit for other dependents (row 7) - worked out}
      - {name: childLivedWithTaxpayer, type: boolean, label: Lived with you more than half the year (row 5a) - months >= 7}
