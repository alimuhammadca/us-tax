# Like-kind exchanges (Form 8824). One entry per section 1031 exchange of real property; the engine figures Parts I-III,
# reports the recognized gain on Schedule D or Form 4797 and fills in Form 8824 (form-8824-plan.md, owner-approved 2026-10-23).
name: like-kind-exchanges-taxpayer
title: Like-kind exchanges (Form 8824)
multiplicity: single
formName: Form 8824
category: income
instructions:
  - Enter each exchange of real property for other real property (a section 1031 like-kind exchange).
sections:
  - name: screening
    title: Screening
    multiplicity: single
    fields:
      - name: hasLikeKindExchange
        type: boolean
        required: true
        label: Did you exchange real property for other real property (a section 1031 like-kind exchange) in 2025, or in 2023 or 2024 with a related party?

  - name: exchange
    title: Exchange
    multiplicity: multiple
    showIf: hasLikeKindExchange == true
    fields:
      - name: propertyGivenUpDescription
        type: text
        required: false
        label: "Property given up (line 1)"
      - name: propertyReceivedDescription
        type: text
        required: false
        label: "Property received (line 2)"
      - name: propertyUse
        type: select
        required: false
        label: "How was the property given up used?"
        options:
          - "investment"
          - "business"
      - name: bothRealProperty
        type: boolean
        required: false
        label: "Both properties are real property held for business or investment"
      - name: givenUpOutsideUs
        type: boolean
        required: false
        label: "The property given up is outside the United States"
      - name: receivedOutsideUs
        type: boolean
        required: false
        label: "The property received is outside the United States"
      - name: dateAcquired
        type: date
        required: false
        label: "Date the property given up was originally acquired (line 3)"
      - name: dateTransferred
        type: date
        required: false
        label: "Date transferred to the other party (line 4)"
      - name: dateIdentified
        type: date
        required: false
        label: "Date the replacement property was identified in writing (line 5)"
      - name: dateReceived
        type: date
        required: false
        label: "Date the replacement property was received (line 6)"
      - name: adjustedBasisGivenUp
        type: amount
        required: false
        label: "Adjusted basis of the property given up (line 18)"
      - name: depreciationAllowed
        type: amount
        required: false
        label: "Depreciation allowed or allowable on the property given up"
      - name: section1245DepreciationAllowed
        type: amount
        required: false
        label: "Depreciation on parts that are section 1245 property (optional, line 21)"
      - name: fmvLikeKindReceived
        type: amount
        required: false
        label: "Fair market value of the property received (line 16)"
      - name: fmv1245Received
        type: amount
        required: false
        label: "Fair market value of section 1245 parts of the property received (optional, line 25b)"
      - name: cashReceived
        type: amount
        required: false
        label: "Cash received (line 15)"
      - name: otherPropertyReceivedFmv
        type: amount
        required: false
        label: "FMV of other (not like-kind) property received (line 15)"
      - name: otherPropertyReceivedDescription
        type: text
        required: false
        label: "Description of the other property received (line 15a)"
        showIf: "otherPropertyReceivedFmv > 0"
      - name: liabilitiesAssumedByOtherParty
        type: amount
        required: false
        label: "Debt on your property the other party took over (line 15 / 18)"
      - name: liabilitiesYouAssumed
        type: amount
        required: false
        label: "Debt on the property received that you took over (line 15 / 18)"
      - name: cashPaid
        type: amount
        required: false
        label: "Cash paid to the other party (line 15 / 18)"
      - name: otherPropertyGivenUpFmv
        type: amount
        required: false
        label: "FMV of other (not like-kind) property given up (line 12)"
      - name: otherPropertyGivenUpBasis
        type: amount
        required: false
        label: "Adjusted basis of the other property given up (line 13)"
        showIf: "otherPropertyGivenUpFmv > 0"
      - name: otherPropertyGivenUpDescription
        type: text
        required: false
        label: "Description of the other property given up (line 12a)"
        showIf: "otherPropertyGivenUpFmv > 0"
      - name: exchangeExpenses
        type: amount
        required: false
        label: "Exchange expenses (line 15 / 18)"
      - name: relatedParty
        type: boolean
        required: false
        label: "Exchange made with a related party (line 7)"
      - name: relatedPartyName
        type: text
        required: false
        label: "Related party's name (line 8)"
        showIf: "relatedParty == true"
      - name: relatedPartyRelationship
        type: text
        required: false
        label: "Relationship (line 8)"
        showIf: "relatedParty == true"
      - name: relatedPartyTin
        type: text
        required: false
        label: "Related party's SSN or EIN (line 8)"
        showIf: "relatedParty == true"
      - name: relatedPartyAddress
        type: text
        required: false
        label: "Related party's address (line 8)"
        showIf: "relatedParty == true"
      - name: relatedPartyDisposed
        type: boolean
        required: false
        label: "Related party disposed of the property within 2 years (line 9)"
        showIf: "relatedParty == true"
      - name: youDisposed
        type: boolean
        required: false
        label: "You disposed of the property received within 2 years (line 10)"
        showIf: "relatedParty == true"
      - name: relatedPartyException
        type: select
        required: false
        label: "Exception to the disposition (line 11)"
        options:
          - "none"
          - "death"
          - "involuntary_conversion"
          - "no_tax_avoidance"
        showIf: "relatedPartyDisposed == true || youDisposed == true"
      - name: taxAvoidanceExplanation
        type: text
        required: false
        label: "Explanation for line 11c"
        showIf: "relatedPartyException == no_tax_avoidance"
      # Special cases, Form 8824 Part III detail and related-party (Part II) follow-ups.
      - name: specialCases
        type: list
        required: false
        label: "Do any of these special cases apply? (check all that apply)"
        options: ["main_home", "installment_note", "section_1043", "multi_asset"]
        help: "Checkbox list stored as an array of the option values."
      - name: section121ExcludedGain
        type: number
        required: false
        label: "Home-sale exclusion (section 121) you are claiming"
        showIf: "specialCases includes 'main_home'"
      - name: homeUsePercentAtExchange
        type: number
        required: false
        label: "If part of the property was still your home on the exchange date, what percent? (blank if none)"
        showIf: "specialCases includes 'main_home'"
      - name: noteFaceAmount
        type: number
        required: false
        label: "Face amount of the note you received"
        showIf: "specialCases includes 'installment_note'"
      - name: notePaymentsReceived
        type: number
        required: false
        label: "Principal paid on the note in 2025"
        showIf: "specialCases includes 'installment_note'"
      - name: section1043CertificateNumber
        type: text
        required: false
        label: "Certificate of divestiture number"
        showIf: "specialCases includes 'section_1043'"
      - name: section1043SalesPrice
        type: number
        required: false
        label: "Sales price of the divested property, less selling expenses"
        showIf: "specialCases includes 'section_1043'"
      - name: section1043Basis
        type: number
        required: false
        label: "Basis of the divested property"
        showIf: "specialCases includes 'section_1043'"
      - name: section1043ReplacementCost
        type: number
        required: false
        label: "Cost of replacement property bought within 60 days after the sale"
        showIf: "specialCases includes 'section_1043'"
      - name: section1043OrdinaryRecapture
        type: number
        required: false
        label: "Ordinary income recapture on the divested property (optional)"
        showIf: "specialCases includes 'section_1043'"
      - name: section1250AdditionalDepreciation
        type: number
        required: false
        label: "Depreciation above straight-line on the building given up - optional"
      - name: otherPropertyGivenUpKind
        type: select
        required: false
        label: "What kind of property was it?"
        options: ["capital", "business", "ordinary"]
        help: "Its gain or loss is reported as if it had been sold, on its own form and with its own holding period."
      - name: otherPropertyGivenUpDateAcquired
        type: date
        required: false
        label: "Date the other property was acquired (YYYY-MM-DD)"
        showIf: "otherPropertyGivenUpKind == 'capital' || otherPropertyGivenUpKind == 'business'"
      - name: riskOfLossReduced
        type: boolean
        required: false
        label: "Was your or the related party's risk of loss on the property substantially reduced for part of the 2 years (for example by a put, a short sale or a similar arrangement)?"
        showIf: "relatedParty == true"
      - name: riskOfLossReducedDays
        type: number
        required: false
        label: "For how many days?"
        showIf: "riskOfLossReduced == true"
      - name: relatedPartySoldReplacementViaQi
        type: boolean
        required: false
        label: "Did a related party sell the property you received into the exchange for cash or other property, through a qualified intermediary or another unrelated party?"
