# U.S. possession bona-fide-resident income exclusion (IRC 931 / 933; Form 4563 for American Samoa) - taxpayer / family head.
# Unified intake for American Samoa, Puerto Rico, Guam, USVI and CNMI residents.
name: possession-residence-exclusion-taxpayer
title: Income from living in a U.S. territory (possession exclusion)
multiplicity: single
formName: Form 4563
category: income
instructions:
  - Answer Yes only if you lived in a U.S. territory in 2025 and some of your income is excluded from U.S. tax.
  - Amounts entered here are excluded income from sources within the territory.

sections:
  - name: screening
    title: "Did this apply?"
    multiplicity: single
    fields:
      - name: hasPossessionExcludedIncome
        type: boolean
        required: true
        label: "Did you have income from living in a US territory in 2025?"

  - name: territory
    title: "Which territory?"
    multiplicity: single
    showIf: hasPossessionExcludedIncome == true
    fields:
      - name: possession
        type: select
        required: true
        label: Territory
        options: [american_samoa, puerto_rico, guam, usvi, cnmi]

  - name: residence
    title: Where you lived
    multiplicity: single
    showIf: hasPossessionExcludedIncome == true
    fields:
      - name: isBonaFideResidentEntireTaxYear
        type: boolean
        required: true
        label: "Were you a permanent (bona fide) resident of the territory for all of 2025?"
      - name: priorYearWasBonaFideResident
        type: boolean
        required: false
        label: "Were you a permanent resident of the territory in 2024?"
        help: Asked for a part-year resident claiming a large exclusion.
      - name: typeOfLivingQuarters
        type: select
        required: false
        label: Type of housing in American Samoa
        showIf: "possession == 'american_samoa'"
        options: [rented_room, rented_house, employer_furnished, own_home]   # Form 4563 line 2; the old quarters_in_hotel shows as rented_room
      - name: familyLivedWithYou
        type: boolean
        required: false
        label: "Did any of your family live with you in American Samoa during any part of 2025?"
        showIf: "possession == 'american_samoa'"
      - name: familyLivedWithYouDates
        type: text
        required: false
        label: "Who, and for what period?"   # Form 4563 line 3b
        showIf: familyLivedWithYou == true
      - name: homeMaintainedInUs
        type: boolean
        required: false
        label: "Did you keep any home outside American Samoa?"   # Form 4563 line 4a
        showIf: "possession == 'american_samoa'"
      - name: homeMaintainedInUsAddress
        type: text
        required: false
        label: "Address of each home, and whether it was rented"
        showIf: homeMaintainedInUs == true
      - name: homeMaintainedInUsOccupiedBy
        type: text
        required: false
        label: "Who lived there, and their relationship to you"
        showIf: homeMaintainedInUs == true
      # daysInAmericanSamoa / daysInUs / daysElsewhere: no longer asked (2026-11-07, owner) - Form 4563 line 6 is the absences table below.

  - name: absences
    title: Absences from American Samoa (Form 4563 line 6, V434)
    multiplicity: multiple
    showIf: "possession == 'american_samoa'"
    fields:
      - name: dateLeft
        type: date
        required: false
        label: Date left
      - name: dateReturned
        type: date
        required: false
        label: Date returned
      - name: daysAbsent
        type: number
        required: false
        label: Number of days absent
        help: Counted from the two dates when blank (the days of leaving and returning are days in American Samoa).
      - name: reason
        type: text
        required: false
        label: Reason for absence

  - name: employmentEntries
    title: Employers in American Samoa
    multiplicity: multiple
    showIf: "possession == 'american_samoa'"
    fields:
      - name: employerName
        type: text
        required: false
        label: Employer name
      - name: employmentType
        type: select
        required: false
        label: "Employer, or self-employed"   # Form 4563 line 5; U.S. government pay can't be excluded (warning)
        options: [private, american_samoa_government, us_government, self_employed]
      - name: employerAddress
        type: text
        required: false
        label: Employer address
      # datesOfEmployment: no longer asked (2026-11-07, owner; not on Form 4563); kept as saved.

  - name: excludedIncome
    title: Income from sources within the territory (excluded)
    multiplicity: single
    showIf: "hasPossessionExcludedIncome == true && (possession == 'american_samoa' || possession == 'puerto_rico')"   # Guam / CNMI / USVI file with the territory (Pub. 570)
    fields:
      - name: wagesFromPossessionSources
        type: amount
        required: false
        label: "Wages, salaries, tips from territory sources (label varies by territory)"
      - name: taxableInterestExcluded
        type: amount
        required: false
        label: Taxable interest from territory sources
      - name: ordinaryDividendsExcluded
        type: amount
        required: false
        label: Ordinary dividends from territory sources
      - name: rentsRoyaltiesExcluded
        type: amount
        required: false
        label: Rents and royalties from territory sources
      - name: farmGrossIncomeExcluded
        type: amount
        required: false
        label: "Net profit of a farm in the territory (Form 4563 line 13)"
      - name: businessGrossIncomeExcluded
        type: amount
        required: false
        label: "Net profit of a business in the territory (Form 4563 line 10)"
      - name: capitalGainsLossNetExcluded
        type: amount
        required: false
        label: "Capital gain from territory sources (Form 4563 line 11; no loss)"
      - name: otherIncomeDescription
        type: text
        required: false
        label: Other income from territory sources - description
      - name: otherIncomeAmount
        type: amount
        required: false
        label: Other income from territory sources - amount
      - name: totalExcludedIncomeOverride
        type: amount
        required: false
        label: Total override (optional - replaces the auto-computed sum above)
