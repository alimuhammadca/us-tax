# Refund and amount owed - Form 1040 lines 34-38, Form 8888 and the Form 2210 inputs. refund-and-amount-owed-taxpayer, and the
# spouse's own copy on separate returns (refund-and-amount-owed-spouse; a note on a joint return). Applications section.
# Screen review 2026-11-10 (owner, V466): the five estimated-payment answers removed (nothing read them - Form 2210 takes the dated
# payments from Estimated tax payments); the 2024 AGI, tax and filing status filled from last year's return or upload; box E worked
# out from the two filing statuses; the box B amount, the box E line 8 tax and the annualized method (box C) added.
formId: refund-and-amount-owed-taxpayer
title: Refund and amount owed

sections:
  - name: applyToNextYear
    title: Applied to next year's estimated tax (line 36)
    showIf: "overpaid"
    fields:
      - {name: electsApplyToNextYear, type: boolean}
      - {name: amountToApply, type: amount, showIf: "electsApplyToNextYear", note: "capped at the overpayment"}
  - name: directDeposit
    title: Direct deposit (lines 35b-35d)
    showIf: "overpaid and wantsRefundAllocation != true"
    fields:
      - {name: wantsDirectDeposit, type: boolean}
      - {name: routingNumber, type: digits, showIf: wantsDirectDeposit, note: "9 digits, 01-12 / 21-32, ABA check digit; eye"}
      - {name: accountType, type: select, options: [checking, savings], showIf: wantsDirectDeposit}
      - {name: accountNumber, type: text, showIf: wantsDirectDeposit, note: "up to 17 characters; eye"}
  - name: splitRefund
    title: Split refund (Form 8888)
    showIf: "overpaid and wantsDirectDeposit != true and no Form 8379"
    fields:
      - {name: wantsRefundAllocation, type: boolean}
      - {name: "account{1,2,3}Amount / Routing / Type / Number", type: group, showIf: wantsRefundAllocation}
  - name: recoveries
    title: 2024 deductions refunded in 2025
    showIf: "a state or local refund or a Form 1098 box 4 refund on the return"
    fields:
      - {name: priorYearItemizedDeductionsClaimed, type: boolean}
      - {name: priorYearTotalItemizedDeductions, type: amount}
      - {name: priorYearStateLocalTaxesBeforeCap, type: amount}
      - {name: priorYearMortgageInterestDeducted, type: amount}
      - {name: priorYearTaxableIncome, type: amount}
  - name: priorYear
    title: 2024 figures for the underpayment penalty (Form 2210)
    showIf: "amount owed"
    fields:
      - {name: priorYearFilingStatus, type: select, note: "filled from last year's return or upload when blank"}
      - {name: priorYearAgi, type: amount, note: "filled - line 11"}
      - {name: priorYearTaxLiability, type: amount, note: "filled - Form 2210 line 8 (line 22 + listed Schedule 2 taxes - refundable credits)"}
      - {name: boxEAllocatedPriorYearTax, type: amount, showIf: "a joint return for one of 2024 / 2025 only (box E)"}
  - name: waiver
    title: Penalty waiver and annualized income (Form 2210 Part II)
    fields:
      - {name: waiveFullPenalty, type: boolean, label: box A}
      - {name: waivePartialPenalty, type: boolean, label: box B}
      - {name: boxBWaiverAmount, type: amount, showIf: waivePartialPenalty}
      - {name: annualizedMethodElected, type: boolean, label: "box C (Schedule AI)"}
      - {name: "annualizedIncome1-4", type: amount, showIf: annualizedMethodElected}
  - name: farmFishing
    title: Farming or fishing income (Form 2210-F)
    fields:
      - {name: priorYearGrossFarmIncome, type: amount}
      - {name: priorYearTotalGrossIncome, type: amount}
      - {name: currentYearOtherGrossFarmFishingIncome, type: amount}
      - {name: fileAndPayByMarch2, type: boolean}
  - name: computedOutputs
    readOnly: true
    computed: true
    fields:
      - {name: jointSeparateMismatch, type: boolean, label: "Form 2210 box E - worked out from the two filing statuses"}
      - {name: "madeEstimatedPayments, payment1-4Amount", type: removed, label: "cleared on save (V466)"}
