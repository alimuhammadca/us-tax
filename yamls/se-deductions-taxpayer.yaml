# Self-employed deductions (taxpayer/family head): Schedule 1 lines 16-17.
# Single-instance capture of Form 7206 self-employed health insurance inputs and
# self-employed retirement plan contributions. Compute (Form 7206 limit, line-16
# 20%-of-net calc) is added in Stage 2.
name: se-deductions-taxpayer
title: Self-employed deductions (taxpayer/family head)
multiplicity: single
formName: Schedule 1
category: deductions
instructions:
  - Enter self-employed health insurance premiums and self-employed retirement plan contributions.
  - The deductible amounts are limited to your self-employment earnings and computed later; they flow to Schedule 1 lines 16 and 17.
# driftIgnore (YAML drift sync 2026-10-28): jan..dec are the component's monthKeys checkbox ids; the model stores the checked
# months as CSV strings (seEmployerPlanEligibleMonths / seDependentEmployerPlanEligibleMonths / seLtcEmployerPlanEligibleMonths).
driftIgnore: [jan, feb, mar, apr, may, jun, jul, aug, sep, oct, nov, dec]
sections:
  - name: screening
    title: Screening
    multiplicity: single
    fields:
      - name: hasSeDeductions
        type: boolean
        required: true
        label: Did you pay self-employed health insurance or make self-employed retirement contributions in 2025?

  - name: health
    title: Self-employed health insurance (Form 7206)
    multiplicity: single
    showIf: hasSeDeductions == true
    fields:
      - name: seHealthInsurancePremiums
        type: amount
        required: false
        placeholder: 0.00
        label: Medical, dental, and vision premiums paid
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: seHealthPremiumsPaidFromPsoExclusion
        type: amount
        required: false
        label: "Part of these premiums paid from your retirement plan under the public safety officer exclusion"
        showIf: "hasSeDeductions === true && psoElection"
      - name: seLongTermCarePremiums
        type: amount
        required: false
        placeholder: 0.00
        label: Qualified long-term-care premiums (age-limited)
      - name: medicarePremiums
        type: amount
        required: false
        placeholder: 0.00
        label: Medicare premiums (Part B, Part D, Medigap)
      - name: marketplacePlan
        type: boolean
        required: false
        label: These premiums were for a Marketplace plan with advance premium tax credit
      - name: marketplacePremiumSharePercent
        type: amount
        required: false
        showIf: marketplacePlan == true
        placeholder: e.g. 60
        label: Share of the Marketplace premium for this business (%)
        help: >-
          Only needed when BOTH spouses are self-employed with Marketplace coverage. The percentage
          (0-100) of the household Marketplace enrollment premium (Form 1095-A col A) attributable to this
          business, used to split the §162(l) self-employed-health deduction and the premium tax credit
          across each business's earned-income limit (Pub. 974 "More than one trade or business"). Blank
          defaults to an even 50/50 split; ignored when only one spouse is self-employed.
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: seEmployerPlanEligibleMonths
        type: text
        required: false
        label: "Months you (or your spouse's employer) offered you a subsidized health plan you could have joined, for any part of the month"
        showIf: "hasSeDeductions === true"
        help: "Saved as a CSV of month keys (jan,feb,...). Self-employed health insurance is not deductible for those months (Form 7206)."
      - name: seDependentEmployerPlanEligibleMonths
        type: text
        required: false
        label: "Months the employer of your dependent, or of your child under 27 at the end of 2025, offered a subsidized health plan you could have joined"
        showIf: "hasSeDeductions === true"
        help: "Saved as a CSV of month keys (i7206 p.2)."
      - name: seLtcEmployerPlanEligibleMonths
        type: text
        required: false
        label: "Months any of those employers offered a subsidized plan that provides long-term care insurance"
        showIf: "hasSeDeductions === true"
        help: "Saved as a CSV of month keys; tested separately for long-term care premiums."
      # Added 2026-10-28 (YAML drift sync): field(s) the Angular component binds that this YAML did not document.
      - name: sCorpMoreThan2PctShareholder
        type: boolean
        required: false
        label: "The premiums were paid by an S corporation in which I own more than 2%, and are included in my W-2 wages from it"
        showIf: "hasSeDeductions === true"
      - name: sCorpWages
        type: amount
        required: false
        label: "W-2 box 1 wages from that S corporation"
        showIf: "hasSeDeductions === true && sCorpMoreThan2PctShareholder === true"

  - name: retirement
    title: Self-employed retirement contributions (line 16)
    multiplicity: single
    showIf: hasSeDeductions == true
    fields:
      - name: sepIraContribution
        type: amount
        required: false
        placeholder: 0.00
        label: SEP-IRA contribution
      - name: simpleIraContribution
        type: amount
        required: false
        placeholder: 0.00
        label: SIMPLE-IRA contribution
      - name: qualifiedPlanContribution
        type: amount
        required: false
        placeholder: 0.00
        label: Other qualified plan contribution (Solo 401(k), defined benefit)

  - name: computedOutputs
    title: Computed outputs
    multiplicity: single
    readOnly: true
    computed: true
    instructions:
      - Backend-only computed results (Stage 2). Not rendered by the UI.
    fields:
      - name: line17SeHealthDeduction
        type: amount
        readOnly: true
        computed: true
        label: Schedule 1 line 17 self-employed health insurance deduction
      - name: line16SeRetirementDeduction
        type: amount
        readOnly: true
        computed: true
        label: Schedule 1 line 16 self-employed retirement deduction
