# Schedule SE elections and special situations (taxpayer/family head).
# Single-instance capture: church employee income, clergy + Form 4361/4029, optional
# methods, Notice 2014-7 election, prior-year unreported tips, group-term-life additions.
# The Schedule SE computation is added in Stage 2.
name: se-tax-options-taxpayer
title: Self-employment tax options (taxpayer/family head)
multiplicity: single
formName: Schedule SE
category: income
instructions:
  - Complete this only if a Schedule SE special situation applies (church employee, clergy, optional methods, or the Medicaid-waiver election).
  - Most self-employed filers can answer No and skip this form.
sections:
  - name: screening
    title: Screening
    multiplicity: single
    fields:
      - name: hasSeTaxOptions
        type: boolean
        required: true
        label: Do any Schedule SE special situations apply to you?

  - name: churchClergy
    title: Church employee and clergy
    multiplicity: single
    showIf: hasSeTaxOptions == true
    fields:
      - name: churchEmployeeIncome
        type: amount
        required: false
        label: Church employee income (W-2 with no Social Security tax withheld)
      - name: isClergy
        type: boolean
        required: false
        label: Are you a member of the clergy filing Schedule SE?
      - name: clergyHousingAllowance
        type: amount
        required: false
        label: Housing / parsonage allowance (subject to SE tax)

      - name: clergyHousingAmountUsed
        type: amount
        required: false
        label: "Amount of the allowance you actually spent on your home (rent or mortgage, utilities, furnishings, repairs)"
        showIf: isClergy == true

      - name: clergyHomeFairRentalValue
        type: amount
        required: false
        label: "Your home's fair rental value for the year (furnished, plus utilities)"
        showIf: isClergy == true

      - name: clergyReasonablePayForServices
        type: amount
        required: false
        label: Reasonable pay for your services as a minister (if you know it)
        showIf: isClergy == true

      - name: ministerialW2Wages
        type: amount
        required: false
        label: "Ministerial W-2 wages (church salary, no FICA - subject to SE tax)"
        showIf: isClergy == true

      - name: ministerUnreimbursedExpenses
        type: amount
        required: false
        label: Unreimbursed business expenses as a church-employed minister (optional)
        showIf: isClergy == true

      - name: foreignGovernmentWages
        type: amount
        required: false
        label: Pay as a U.S. citizen from a foreign government or an international organization for work in the United States (optional)

      - name: notaryFeeIncome
        type: amount
        required: false
        label: Notary public fees included in your business income (excluded from SE tax)

      - name: receivingSsBenefitsWhenCrpPaid
        type: boolean
        required: false
        label: "If you received Conservation Reserve Program (CRP) payments: were you already receiving Social Security retirement or disability benefits when you received them?"
      - name: form4361Exemption
        type: boolean
        required: false
        label: Form 4361 approved - exempt from SE tax on ministerial earnings
      - name: form4029Exemption
        type: boolean
        required: false
        label: Form 4029 approved - recognized religious sect exemption

      - name: totalizationExempt
        type: boolean
        required: false
        label: "Is your self-employment income exempt from U.S. self-employment tax under a social security (totalization) agreement with another country?"

      - name: totalizationCountry
        type: text
        required: false
        label: Country
        showIf: totalizationExempt == true

  - name: optionalMethods
    title: Optional methods
    multiplicity: single
    showIf: hasSeTaxOptions == true
    fields:
      - name: farmOptionalMethod
        type: boolean
        required: false
        label: Use the farm optional method
      - name: nonfarmOptionalMethod
        type: boolean
        required: false
        label: Use the nonfarm optional method

      - name: metTwoOfThreePriorYearsSe400
        type: boolean
        required: false
        label: "Did you have $400+ net self-employment earnings in at least 2 of the last 3 years?"
        showIf: nonfarmOptionalMethod == true

      - name: nonfarmOptionalMethodPriorUses
        type: number
        required: false
        label: "How many prior years have you used the nonfarm optional method? (max 5 allowed in a lifetime)"
        showIf: nonfarmOptionalMethod == true

  - name: other
    title: Other
    multiplicity: single
    showIf: hasSeTaxOptions == true
    fields:
      - name: medicaidWaiverIncludeInSe
        type: boolean
        required: false
        label: Elect to include Medicaid-waiver payments (Notice 2014-7) in SE earnings
      - name: priorYearUnreportedTips
        type: amount
        required: false
        label: Prior-year unreported tips subject to SE tax

      - name: priorYearBusinessAtRiskCarryforward
        type: amount
        required: false
        label: Prior-year suspended at-risk loss - Schedule C business (465 carryforward)

      - name: priorYearSection179Carryover
        type: amount
        required: false
        label: Section 179 deduction carried over from 2024 (Form 4562 line 10)

      - name: priorYearFarmAtRiskCarryforward
        type: amount
        required: false
        label: Prior-year suspended at-risk loss - Schedule F farm (465 carryforward)
      - name: groupTermLifeAdditions
        type: amount
        required: false
        label: Group-term-life insurance additions to SE income

  - name: computedOutputs
    title: Computed outputs
    multiplicity: single
    readOnly: true
    computed: true
    instructions:
      - Backend-only computed results (Stage 2). Not rendered by the UI.
    fields:
      - name: scheduleSeTax
        type: amount
        readOnly: true
        computed: true
        label: Schedule SE self-employment tax (to Schedule 2 line 4)
